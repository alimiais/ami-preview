<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MiCC Safe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              emerald: '#0B5C4A',
              emeraldHover: '#084739',
              navy: '#1E3A5F',
              crimson: '#9B1C1C',
              border: '#D9E2EC',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', 'Inter', 'sans-serif';
      -webkit-font-smoothing: antialiased;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    /* Tier cards (bank-card style) */
    .tier-card { position: relative; overflow: hidden; border-radius: 20px; box-shadow: 0 6px 18px -8px rgba(15,23,42,.45), inset 0 1px 0 rgba(255,255,255,.18); }
    .tier-card::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 55%), repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, rgba(255,255,255,0) 2px 9px); }
    .tier-card > * { position: relative; z-index: 1; }
    .tier-classic { background: linear-gradient(135deg, #064E3B 0%, #047857 45%, #10B981 78%, #065F46 100%); color: #FFFFFF; }
    .tier-silver { background: linear-gradient(135deg, #F1F3F6 0%, #B4BCC8 50%, #E1E5EA 100%); color: #111827; }
    .tier-gold { background: linear-gradient(135deg, #F8E08E 0%, #D4A12A 55%, #F3CF6B 100%); color: #3A2705; }
    .tier-platinum { background: linear-gradient(135deg, #1C2026 0%, #3E454E 32%, #8C949E 50%, #4A5159 66%, #23272D 100%); color: #F8FAFC; }
    .tier-diamond { background: radial-gradient(circle at 18% 28%, rgba(255,255,255,.95) 0 1.5px, rgba(255,255,255,0) 2.5px), radial-gradient(circle at 72% 64%, rgba(255,255,255,.9) 0 1.2px, rgba(255,255,255,0) 2.2px), radial-gradient(circle at 88% 22%, rgba(255,255,255,.85) 0 1px, rgba(255,255,255,0) 2px), linear-gradient(135deg, #E6F7FF 0%, #A8DEF7 30%, #F2FBFF 48%, #7FC7EE 68%, #CDEFFF 100%); color: #0A2540; }
    .tier-silver .bg-black\/20, .tier-gold .bg-black\/20, .tier-diamond .bg-black\/20 { background: rgba(255,255,255,.5); }
    .tier-silver .bg-white, .tier-gold .bg-white, .tier-diamond .bg-white { background: #1E293B; }
    .tier-silver .bg-white\/15, .tier-gold .bg-white\/15, .tier-diamond .bg-white\/15, .tier-silver .bg-white\/20, .tier-gold .bg-white\/20, .tier-diamond .bg-white\/20 { background: rgba(15,23,42,.14); }
    .tc-chip { width: 34px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,.25)); border: 1px solid rgba(0,0,0,.18); }
    .tier-silver .tc-chip, .tier-gold .tc-chip, .tier-diamond .tc-chip { background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(120,90,20,.25)); }
    .tc-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); }
    .tier-silver .tc-badge, .tier-gold .tc-badge, .tier-diamond .tc-badge { background: rgba(15,23,42,.12); border-color: rgba(15,23,42,.25); }
    .tc-bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
    .tc-bar > div { height: 100%; border-radius: 999px; background: currentColor; }
    .tier-silver .tc-bar, .tier-gold .tc-bar, .tier-diamond .tc-bar { background: rgba(15,23,42,.15); }
    .tier-card.is-current { box-shadow: 0 0 0 2px #fff, 0 0 0 5px #10B981, 0 10px 24px -8px rgba(16,185,129,.55); }
    .dark .tier-card.is-current { box-shadow: 0 0 0 2px #0F172A, 0 0 0 5px #34D399, 0 10px 24px -8px rgba(52,211,153,.4); }


    /* Compact tier guide cards */
    .tier-card.tier-mini { border-radius: 14px; }
    .tier-mini .tc-chip { width: 26px; height: 20px; border-radius: 5px; }
    .tier-mini .tc-badge { padding: 1px 7px; font-size: 9.5px; }
    .tier-mini .tc-bar { height: 4px; }
    /* Moving shimmer on progress bars */
    .tc-bar > div, .tc-shine { position: relative; overflow: hidden; }
    .tc-bar > div::after, .tc-shine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.65) 50%, rgba(255,255,255,0) 100%); transform: translateX(-100%); animation: tcShine 2.4s ease-in-out infinite; }
    .tier-silver .tc-bar > div::after, .tier-gold .tc-bar > div::after, .tier-diamond .tc-bar > div::after { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%); }
    @keyframes tcShine { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .tc-bar > div::after, .tc-shine::after { animation: none; display: none; } }
    /* MiCC logo coin */
    .micc-coin { border-radius: 999px; object-fit: cover; box-shadow: 0 0 0 1.5px rgba(212,175,55,.75), 0 6px 14px -6px rgba(0,0,0,.55); background: #111; }
    /* MiCC Safe hero (navy + gold) */
    .safe-hero { position: relative; overflow: hidden; color: #fff; border: 1px solid rgba(212,175,55,.35); background: radial-gradient(110% 80% at 100% 0%, rgba(212,175,55,.30) 0%, rgba(212,175,55,0) 55%), linear-gradient(135deg, #0A1A31 0%, #13294B 55%, #0B1A30 100%); box-shadow: 0 14px 30px -14px rgba(10,26,49,.7); }
    .safe-hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(120deg, rgba(212,175,55,.06) 0 1px, rgba(212,175,55,0) 1px 14px); }
    .safe-hero::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 999px; inset-inline-end: -70px; bottom: -110px; border: 1px solid rgba(212,175,55,.22); box-shadow: 0 0 0 18px rgba(212,175,55,.04), 0 0 0 40px rgba(212,175,55,.03); pointer-events: none; }
    .safe-hero > * { position: relative; z-index: 1; }
    .gold-text { color: #E9C46A; }
    .btn-gold { background: linear-gradient(135deg, #F3D98B 0%, #D4AF37 55%, #B8912A 100%); color: #0A1A31; }
    .btn-ghost-gold { border: 1px solid rgba(233,196,106,.45); background: rgba(255,255,255,.05); color: #fff; }
    /* Asset cards with emblems */
    .asset-card { position: relative; overflow: hidden; border: 1px solid #E5E7EB; background: #fff; }
    .asset-card::before { content: ""; position: absolute; top: 0; inset-inline: 0; height: 3px; background: linear-gradient(90deg, #B8912A, #F3D98B, #B8912A); }
    .dark .asset-card { border-color: #1E293B; background: #0F172A; }
    .asset-emblem { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: #E9C46A; background: radial-gradient(circle at 30% 25%, #1F3B66 0%, #0A1A31 75%); box-shadow: inset 0 0 0 1.5px rgba(212,175,55,.7), 0 6px 14px -8px rgba(10,26,49,.8); }
    .asset-emblem svg { width: 58%; height: 58%; }
    .btn-navy { background: #13294B; color: #fff; }
    .dark .btn-navy { background: #1E3A64; }
    .btn-outline-gold { border: 1px solid #C9A23A; color: #8A6A16; background: transparent; }
    .dark .btn-outline-gold { color: #E9C46A; border-color: rgba(233,196,106,.6); }


    /* Tier guide: Apple-Wallet style stack */
    .tg-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(2,6,23,.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .tg-wrap { --tw: min(72vw, 270px); width: var(--tw); margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 0 28px; }
    .tg-slot { position: relative; height: 60px; transition: height .28s ease; }
    .tg-slot.is-open { height: calc(var(--tw) / 1.586 + 10px); }
    .tg-slot > .tier-card { position: absolute; top: 0; inset-inline: 0; z-index: 0; isolation: isolate; cursor: pointer; }
    .tier-card.tg-card { aspect-ratio: 1.586 / 1; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; box-shadow: 0 -4px 14px -6px rgba(0,0,0,.55), 0 10px 22px -10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.22); }
    .tg-card .tc-chip { width: 28px; height: 21px; border-radius: 5px; }
    .tg-card .tc-badge { padding: 1px 7px; font-size: 9.5px; }
    .tg-card .tc-bar { height: 4px; }
    .tg-logo { width: 22px; height: 22px; }
    .tier-card.tg-card.is-current { box-shadow: 0 0 0 2px #34D399, 0 10px 24px -8px rgba(52,211,153,.55); }
    .tier-diamond.tg-card { box-shadow: 0 -4px 14px -6px rgba(0,0,0,.5), 0 10px 26px -8px rgba(127,199,238,.6), inset 0 1px 0 rgba(255,255,255,.7); }
    /* Inline tier guide grid (v8) */
    .tg-grid { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 100%; margin-inline: auto; }
    .tg-grid .tier-card.tg-card { flex: none; width: 170px; aspect-ratio: 1.586 / 1; border-radius: 11px; padding: 9px 11px; cursor: default; box-shadow: 0 8px 18px -10px rgba(15,23,42,.55), inset 0 1px 0 rgba(255,255,255,.22); }
    .tg-grid .tier-card.tg-card.is-current { box-shadow: 0 0 0 3px #dc2626, 0 0 18px 2px rgba(220,38,38,.45), 0 10px 22px -10px rgba(15,23,42,.55); }
    .dark .tg-grid .tier-card.tg-card.is-current { box-shadow: 0 0 0 3px #ef4444, 0 0 20px 3px rgba(239,68,68,.45), 0 10px 22px -10px rgba(0,0,0,.6); }
    .tg-grid .tc-chip { width: 22px; height: 16px; border-radius: 4px; }
    .tg-grid .tg-logo { width: 18px; height: 18px; }
    .tg-grid .tc-badge { padding: 1px 6px; font-size: 8.5px; gap: 2px; white-space: nowrap; }
    .tg-grid .tc-bar { height: 3px; }
    .tg-grid .tier-card.tg-card > * { position: relative; z-index: 1; }
    /* Safe card actions (v10): three equal gold-framed tiles */
    .safe-acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: stretch; }
    .safe-act { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; min-height: 96px; padding: 10px 4px 9px; border-radius: 14px; text-align: center; color: #fff; border: 1px solid transparent; background: linear-gradient(160deg, rgba(31,59,102,.92), rgba(10,26,49,.94)) padding-box, linear-gradient(135deg, #F3D98B 0%, #B8912A 45%, #F3D98B 100%) border-box; box-shadow: 0 8px 18px -12px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); transition: transform .15s ease, box-shadow .15s ease; }
    .safe-act:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -12px rgba(212,175,55,.55), inset 0 1px 0 rgba(255,255,255,.1); }
    .safe-act:active { transform: translateY(0); }
    .safe-act .sa-ic { width: 32px; height: 32px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: #0A1A31; background: linear-gradient(135deg, #F3D98B 0%, #D4AF37 55%, #B8912A 100%); box-shadow: 0 0 0 3px rgba(212,175,55,.15); }
    .safe-act .sa-ic svg { width: 17px; height: 17px; }
    /* v11: muted icon tones per action (frames stay gold) */
    .safe-act .sa-ic.sa-ic-blue { color: #fff; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.85) 0%, rgba(255,255,255,.28) 22%, rgba(255,255,255,0) 46%), linear-gradient(135deg, #C9A2F2 0%, #8E4FD6 55%, #5E2A9E 100%); box-shadow: inset 0 1.5px 2px rgba(255,255,255,.65), inset 0 -3px 5px rgba(0,0,0,.28), 0 0 0 3px rgba(142,79,214,.28), 0 3px 8px -2px rgba(0,0,0,.45); }
    .safe-act .sa-ic.sa-ic-red { color: #fff; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.85) 0%, rgba(255,255,255,.28) 22%, rgba(255,255,255,0) 46%), linear-gradient(135deg, #FFC48A 0%, #F28A25 55%, #C25E0A 100%); box-shadow: inset 0 1.5px 2px rgba(255,255,255,.65), inset 0 -3px 5px rgba(0,0,0,.28), 0 0 0 3px rgba(242,138,37,.28), 0 3px 8px -2px rgba(0,0,0,.45); }
    .safe-act .sa-ic.sa-ic-green { color: #fff; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.85) 0%, rgba(255,255,255,.28) 22%, rgba(255,255,255,0) 46%), linear-gradient(135deg, #93D3B4 0%, #3E9A74 55%, #23704F 100%); box-shadow: inset 0 1.5px 2px rgba(255,255,255,.65), inset 0 -3px 5px rgba(0,0,0,.28), 0 0 0 3px rgba(62,154,116,.28), 0 3px 8px -2px rgba(0,0,0,.45); }
    .safe-act .sa-lb { font-size: 11.5px; font-weight: 700; line-height: 1.25; }
    .safe-xfer { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; color: #E9C46A; border: 1px solid rgba(233,196,106,.6); background: rgba(255,255,255,.05); }
    .safe-xfer:hover { background: rgba(233,196,106,.12); }
    .modal-compact { padding: 14px 16px !important; }
    .modal-compact > div:first-child { margin-bottom: 10px !important; padding-bottom: 8px !important; }
    .sw-page { display:flex; flex-direction:column; min-height: calc(100svh - 215px); margin: 0 -1rem; padding: 0 1rem 1.25rem; background: linear-gradient(180deg, transparent 0%, transparent 45%, #FBF1D6 100%); }
    .dark .sw-page { background: linear-gradient(180deg, transparent 0%, transparent 45%, rgba(212,175,55,.12) 100%); }
    .sw-chest-wrap { flex:1; display:flex; align-items:center; justify-content:center; }
    .sw-page > .safe-welcome, .sw-chest-wrap > div { width:100%; }
    main:has(.sw-page) { padding-bottom:0 !important; display:flex; flex-direction:column; }
    main > .sw-page { flex:1; }
    body:has(.sw-page) #app-footer { margin-top:0 !important; }
    .safe-welcome { background: linear-gradient(160deg, #FFF8E7 0%, #F6E7B8 100%); border: 1px solid rgba(212,175,55,.35); }
    .dark .safe-welcome { background: linear-gradient(160deg, #0A1A31 0%, #132A4A 60%, rgba(212,175,55,.16) 100%); border-color: rgba(212,175,55,.25); }
    .sw-feat { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; background: rgba(255,255,255,.7); border: 1px solid rgba(212,175,55,.35); font-size: 12px; font-weight: 700; color: #0A1A31; }
    .dark .sw-feat { background: rgba(15,23,42,.6); color: #F1F5F9; border-color: rgba(212,175,55,.3); }
    .sw-feat.on { border-color: #D4AF37; box-shadow: 0 0 0 2px rgba(212,175,55,.35); }
    .sw-ic { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: #0A1A31; background: linear-gradient(135deg, #F3D98B 0%, #D4AF37 55%, #B8912A 100%); }
    .sw-ic svg { width: 16px; height: 16px; }
    .sw-line { font-size: 14px; line-height: 1.6; font-weight: 600; color: #0A1A31; background: rgba(255,255,255,.75); border: 1px solid rgba(212,175,55,.35); border-radius: 12px; padding: 8px 12px; }
    .dark .sw-line { color: #F1F5F9; background: rgba(15,23,42,.65); border-color: rgba(212,175,55,.3); }
    .main-welcome + .ami-footer { margin-top: 0; }
    .safe-act .sa-sub { margin-top: auto; font-size: 9.5px; font-weight: 600; line-height: 1.2; color: #E9C46A; }
    /* Footers (v10) */
    .ami-footer { background: linear-gradient(180deg, #0B3D2E 0%, #062A1F 100%); border-top: 2px solid #D4AF37; }
    .safe-footer { background: #1E3A5F; border-top: 0; }
    .dark .ami-footer { background: linear-gradient(180deg, #08301F 0%, #04231A 100%); }
    /* Support chat (v10) */
    /* v13.1: support chat = small floating window in a bottom corner (all screen sizes) */
    /* v13.2: chat stays inside the visible viewport (iOS keyboard): --sc-l/--sc-w/--sc-b/--sc-vh are set from visualViewport in JS */
    .sc-wrap { position: fixed; z-index: 70; pointer-events: none; box-sizing: border-box; left: calc(var(--sc-l, 0px) + 16px); width: calc(var(--sc-w, 100vw) - 32px); bottom: calc(var(--sc-b, 0px) + 16px); display: flex; justify-content: flex-end; transform: none; }
    .sc-panel { pointer-events: auto; box-sizing: border-box; width: min(320px, 82vw); max-width: 100%; height: min(460px, 50vh); max-height: calc(var(--sc-vh, 100vh) - 32px); display: flex; flex-direction: column; overflow: hidden; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px -12px rgba(0,0,0,.55), 0 0 0 1px rgba(15,23,42,.08); }
    .dark .sc-panel { background: #0F172A; }
    /* v13.5: treasure chest image (navy artwork framed in gold; fits light and dark) */
    .safe-chest { display: block; width: 100%; height: auto; object-fit: contain; background: transparent; border: 0; box-shadow: none; border-radius: 0; }
    /* v13.5: minimize chat to a corner bubble (draft and history kept) */
    .sc-mbtn + .sc-x { margin-inline-start: 6px; }
    .sc-bubble { display: none; pointer-events: auto; position: relative; width: 56px; height: 56px; border-radius: 999px; align-items: center; justify-content: center; color: #fff; background: linear-gradient(135deg, #0A1A31 0%, #1E3A5F 100%); border: 2px solid #D4AF37; box-shadow: 0 12px 30px -10px rgba(0,0,0,.55); }
    .sc-ami .sc-bubble { background: linear-gradient(135deg, #04231A 0%, #0E4A37 100%); }
    .sc-bubble svg { width: 24px; height: 24px; }
    .sc-dot { display: none; position: absolute; top: 2px; inset-inline-end: 2px; width: 13px; height: 13px; border-radius: 999px; background: #EF4444; border: 2px solid #fff; }
    .sc-bubble.has-new .sc-dot { display: block; }
    .sc-wrap.sc-min .sc-panel { display: none; }
    .sc-wrap.sc-min .sc-bubble { display: inline-flex; }
    .sc-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: #fff; border-bottom: 2px solid #D4AF37; }
    .sc-safe .sc-head { background: linear-gradient(135deg, #0A1A31 0%, #13294B 60%, #1E3A5F 100%); }
    .sc-ami .sc-head { background: linear-gradient(135deg, #04231A 0%, #0B3D2E 60%, #0E4A37 100%); }
    .sc-av { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: #0A1A31; background: linear-gradient(135deg, #F3D98B, #D4AF37 55%, #B8912A); }
    .sc-av svg { width: 19px; height: 19px; }
    .sc-x { margin-inline-start: auto; width: 32px; height: 32px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,.1); color: #fff; font-size: 18px; line-height: 1; }
    .sc-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #F8FAFC; }
    .dark .sc-list { background: #020617; }
    .sc-msg { max-width: 82%; padding: 8px 11px; border-radius: 14px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .sc-msg .sc-time { display: block; margin-top: 3px; font-size: 9.5px; opacity: .65; }
    .sc-user { align-self: flex-end; color: #fff; border-end-end-radius: 4px; }
    .sc-safe .sc-user { background: #13294B; }
    .sc-ami .sc-user { background: #0B3D2E; }
    .sc-bot { align-self: flex-start; color: #0F172A; background: #fff; border: 1px solid #E5E7EB; border-end-start-radius: 4px; }
    .dark .sc-bot { color: #E2E8F0; background: #1E293B; border-color: #334155; }
    .sc-form { display: flex; align-items: stretch; gap: 8px; box-sizing: border-box; width: 100%; flex: none; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #E5E7EB; background: #fff; }
    .dark .sc-form { background: #0F172A; border-color: #1E293B; }
    .sc-in { flex: 1 1 auto; width: 0; min-width: 0; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; font-size: 16px; /* >=16px: no iOS auto-zoom */ border: 1px solid #CBD5E1; background: #fff; color: #0F172A; }
    .dark .sc-in { background: #020617; border-color: #334155; color: #E2E8F0; }
    .sc-in:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(212,175,55,.2); }
    .sc-send { flex: 0 0 auto; white-space: nowrap; padding: 0 16px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #0A1A31; background: linear-gradient(135deg, #F3D98B 0%, #D4AF37 55%, #B8912A 100%); }

    const SAFE_INITIAL = JSON.stringify(state.safe);

    // ---- v13: two pages (index.html = main site, safe.html = MiCC Safe), one account, shared state ----
    // Both pages are same-origin, so the account state lives in localStorage['ami.shared.v1'] and is

    const PAGE = 'safe';

    // v13.7: key-order-independent JSON, so the main site and Safe (whose user objects list fields in a different order)
    // produce identical text for identical data — otherwise two open tabs keep re-writing the key to each other.
    const sharedSort = v => Array.isArray(v) ? v.map(sharedSort) : (v && typeof v === 'object') ? Object.keys(v).sort().reduce((o, k) => (o[k] = sharedSort(v[k]), o), {}) : v;
    function sharedSnapshot() {
      const safe = Object.assign({}, state.safe); delete safe.prices; // live prices are per page, not shared
      return JSON.stringify(sharedSort({ v: 1, loggedIn: state.loggedIn, lang: state.lang, dark: state.dark, user: state.user, safe: safe, walletLogs: state.walletLogs, supportThreads: state.supportThreads || {} }));
    }
    // v13.5: a page that missed updates (background/suspended tab, back-forward cache on iOS Safari) must not
    // overwrite newer data written by the other page. If storage changed since our last sync, merge field by field:
    // keep the other page's values and apply only the fields this page actually changed.
    function sharedMergeObj(base, mine, theirs) {
      const out = {};
      const keys = new Set([...Object.keys(theirs || {}), ...Object.keys(mine || {})]);
      keys.forEach(k => {
        const mineChanged = JSON.stringify((mine || {})[k]) !== JSON.stringify((base || {})[k]);
        out[k] = mineChanged || !(theirs && k in theirs) ? (mine || {})[k] : theirs[k];
      });
      return out;
    }
    function sharedMerge(base, mine, theirs) {
      const out = sharedMergeObj(base, mine, theirs);
      ['user', 'safe', 'supportThreads'].forEach(k => { if (mine[k] && theirs[k]) out[k] = sharedMergeObj((base || {})[k], mine[k], theirs[k]); });
      return out;
    }
    function saveShared() {
      try {
        let s = sharedSnapshot();
        if (s === sharedLast) return;
        const cur = localStorage.getItem(SHARED_KEY);
        if (cur && sharedLast && cur !== sharedLast) {
          s = JSON.stringify(sharedSort(sharedMerge(JSON.parse(sharedLast), JSON.parse(s), JSON.parse(cur))));
          localStorage.setItem(SHARED_KEY, s);
          loadShared(s);
          return;

        localStorage.setItem(SHARED_KEY, s); sharedLast = s;
      } catch (e) {}
    }
    // Re-read the shared state whenever the page comes back (tab switch, back/forward cache, focus)
    function resyncShared() {
      try {
        const raw = localStorage.getItem(SHARED_KEY);

        if (!d || d.v !== 1) return false;

        sharedLast = raw;

    }

    loadShared();
    if (PAGE === 'safe') state.view = 'safe';
    const TIERS = [
      { id: 'classic',  min: 0,    max: 199,  cls: 'tier-classic',  ar: 'أساسي',  en: 'Basic',  spendSar: 1000,  cycleAr: 'فوري وتلقائي في Safe', cycleEn: 'Instant & Automatic in Safe' },

      { id: 'gold',   min: 600,  max: 1499, cls: 'tier-gold',   ar: 'ذهبي',  en: 'Gold',   spendSar: 6000, cycleAr: 'فوري وتلقائي في Safe', cycleEn: 'Instant & Automatic in Safe' },
      { id: 'platinum',  min: 1500, max: 2999, cls: 'tier-platinum',  ar: 'بلاتيني',  en: 'Platinum',  spendSar: 12000, cycleAr: 'فوري وتلقائي في Safe', cycleEn: 'Instant & Automatic in Safe' },

    // =========================================================
    const t = (ar, en) => state.lang === 'ar' ? ar : en;
    const MU = () => t('ميك', 'MiCC'); // unit label: Arabic «ميك», English MiCC
    const arU = x => state.lang === 'ar' ? String(x).replace(/MiCC(?!\s*(?:Wallet|Safe|Stock))/g, 'ميك') : x;
    const fmt = (n, d = 0) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

    function getCurrentTier() {
      const c = state.user.walletProgressMicc;
      return TIERS.find(tr => c >= tr.min && c <= tr.max) || TIERS[0];
    }

    const SAFE_PROTECT_RATE = 0.30;  // 30% protection, on a full exit only

    // ---- Live market data (falls back silently to static values) ----
    const LIVE_REFRESH_MS = 45000;
    const live = { on: false, updatedAt: null };

    async function liveJson(url) {
      const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = setTimeout(() => ctrl && ctrl.abort(), 9000);
      try {
        const r = await fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
        if (!r.ok) throw new Error('http ' + r.status);
        return await r.json();
      } finally { clearTimeout(timer); }
    }
    const okNum = (v, lo, hi) => { const n = Number(v); return isFinite(n) && n > lo && n < hi ? n : null; };

    async function refreshLive() {
      if (typeof fetch !== 'function') return;
      let btcUsd = null;
      try { const j = await liveJson('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd'); btcUsd = okNum(j && j.bitcoin && j.bitcoin.usd, 1000, 1e7); } catch (e) {}
      if (!btcUsd) { try { const j = await liveJson('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT'); btcUsd = okNum(j && j.price, 1000, 1e7); } catch (e) {} }
      if (!btcUsd) { try { const j = await liveJson('https://api.coinbase.com/v2/prices/BTC-USD/spot'); btcUsd = okNum(j && j.data && j.data.amount, 1000, 1e7); } catch (e) {} }
      if (btcUsd) {
        state.safe.prices.btcUsd = btcUsd;
        live.on = true; live.updatedAt = new Date();
        if (state.view === 'safe') { const y = window.scrollY; render(); if (window.scrollY !== y) window.scrollTo(0, y); }
      }
    }
    function liveBadge(dark) {
      const tm = live.updatedAt ? live.updatedAt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
      return `<span class="inline-flex items-center gap-1.5 text-[10.5px] font-semibold ${dark ? 'text-white/75' : 'text-slate-500 dark:text-slate-400'}"><span class="live-dot ${live.on ? 'on' : ''}"></span>${live.on ? `${t('مباشر', 'Live')} · <span class="tabular-nums" dir="ltr">${tm}</span>` : t('أسعار مرجعية', 'Reference prices')}</span>`;
    }
    function startLive() {
      if (typeof fetch !== 'function' || window.__liveStarted) return;
      window.__liveStarted = true;
      refreshLive();
      setInterval(() => { if (!document.hidden) refreshLive(); }, LIVE_REFRESH_MS);
      document.addEventListener('visibilitychange', () => { if (!document.hidden && (!live.updatedAt || Date.now() - live.updatedAt.getTime() > LIVE_REFRESH_MS)) refreshLive(); });
    }

    function getNextTier() {
      const cur = getCurrentTier();
      const idx = TIERS.findIndex(x => x.id === cur.id);
      return idx < TIERS.length - 1 ? TIERS[idx + 1] : null;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function openModal(title, bodyHtml) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-backdrop').firstElementChild.classList.remove('modal-compact');
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function closeDrawer() {
      document.getElementById('side-drawer-backdrop').classList.add('hidden');
    }

    function openLoginGateModal(pendingView) {
      openModal(t('تسجيل الدخول مطلوب', 'Sign In Required'), `
        <p class="text-sm text-slate-600 dark:text-slate-300 mb-4">
          ${pendingView === 'safe' ? t('يرجى تسجيل الدخول للمتابعة.', 'Please sign in to continue.') : t('لإتمام الحجز أو الشراء أو الوصول إلى محفظة ميك، يرجى تسجيل الدخول أولاً.', 'Please sign in to book, buy, or access your wallet.')}
        </p>
        <button id="gate-login-btn" class="w-full py-2.5 rounded-xl bg-brand-emerald hover:bg-brand-emeraldHover text-white text-sm font-semibold">
          ${t('تسجيل الدخول التجريبي الآن', 'Demo Sign In Now')}
        </button>
      `);
      document.getElementById('gate-login-btn').addEventListener('click', () => {
        state.loggedIn = true;
        closeModal();
        showToast(t('تم تسجيل الدخول التجريبي بنجاح', 'Signed in to demo account'));
        if (pendingView) state.view = pendingView;
        render();
        if (pendingView === 'safe') { window.scrollTo({ top: 0 }); }
      });

    // Renewal (360 SAR) from the Safe MiCC balance, or by selling Bitcoin worth 360 SAR.
    // A renewal sale is not a profit sale (no 20% fee) and reduces capital proportionally.
    function renewMembership(source, auto) {
      const fee = MEMBERSHIP_RENEW_SAR, s = state.safe, h = s.holdings.btc;
      if (source === 'micc') {
        const m = fee / MICC_SAR_VALUE;
        if (s.micc + 1e-9 < m) { if (!auto) showToast(t('رصيد ميك غير كافٍ للتجديد', 'Insufficient MiCC balance for renewal')); return false; }
        safeCapitalOut(fee);
        s.micc -= m;
        s.logs.unshift({ ar: auto ? 'تجديد تلقائي لعضوية برنامج الرفاقة (من رصيد ميك)' : 'تجديد عضوية برنامج الرفاقة (من رصيد ميك)', en: auto ? 'Membership auto-renewal (from MiCC balance)' : 'Membership renewal (from MiCC balance)', amount: `-${fmt(m, 2)} MiCC` });
      } else {
        const price = s.prices.btcUsd * SAR_PER_USD;
        if (!(h.qty * price + 1e-6 >= fee)) { if (!auto) showToast(t('قيمة Bitcoin غير كافية للتجديد', 'Bitcoin value is not enough for renewal')); return false; }
        const qty = Math.min(h.qty, fee / price), frac = qty / h.qty;
        safeCapitalOut(fee);
        h.costSar = Math.max(0, h.costSar - h.costSar * frac);
        h.qty -= qty; if (h.qty < 1e-10) { h.qty = 0; h.costSar = 0; h.avgSar = 0; }
        s.availableStock.btc += qty;
        s.logs.unshift({ ar: auto ? 'تجديد تلقائي للعضوية (بيع Bitcoin دون رسوم)' : 'تجديد العضوية (بيع Bitcoin دون رسوم)', en: auto ? 'Membership auto-renewal (Bitcoin sale, no fee)' : 'Membership renewal (Bitcoin sale, no fee)', amount: `-${fmt(fee, 2)} SAR` });
      }
      extendMembership();
      return true;
    }

    // ---- v13.5: Bitcoin sell quote (partial or full) ----
    // Cost of the sold part = (sold qty / total qty) × capital. Profit = sale value − that cost.
    // Fee = 20% of profit when profit > 0 (never on a loss, never from capital).
    // Protection (full exit only): loss ≤ 30% → full capital back; loss > 30% → value + 30% of capital.
    function safeSellQuote(sellSar) {
      const h = state.safe.holdings.btc, price = state.safe.prices.btcUsd * SAR_PER_USD;
      const value = h.qty * price;
      if (!(h.qty > 0) || !(sellSar > 0)) return null;
      const full = sellSar >= value - 0.005;
      const qty = full ? h.qty : sellSar / price;
      const saleSar = full ? value : sellSar;
      const frac = full ? 1 : qty / h.qty;
      const costPart = (h.costSar || 0) * frac;
      const profit = saleSar - costPart;
      const fee = profit > 0 ? profit * SAFE_FEE_RATE : 0;
      let payout = saleSar - fee, comp = 0;
      if (full && profit < 0 && costPart > 0) {
        const lossPct = -profit / costPart;
        const target = lossPct <= SAFE_PROTECT_RATE ? costPart : saleSar + SAFE_PROTECT_RATE * costPart;
        comp = target - saleSar; payout = target;
      }
      return { full, qty, saleSar, frac, costPart, profit, fee, comp, payout, payoutMicc: payout / MICC_SAR_VALUE, value, price };
    }

    // v13.9: Bitcoin buy lock (after a full exit at a loss) — clears automatically once the price reaches the previous average
    const btcLockSar = () => { const h = state.safe.holdings.btc; return h.lockAvgSar || (h.lockTargetUsd || 0) * SAR_PER_USD; };
    function btcLockCheck() {
      const h = state.safe.holdings.btc; if (!h.locked) return false;
      if (state.safe.prices.btcUsd * SAR_PER_USD >= btcLockSar() - 0.005) { h.locked = false; h.lockAvgSar = 0; h.lockTargetUsd = 0; return false; }
      return true;
    }

        <input id="ret-micc" type="number" min="1" max="${Math.floor(state.safe.micc)}" value="${Math.min(20, Math.floor(state.safe.micc))}" class="w-full px-3 py-2 rounded-xl border border-brand-border dark:border-slate-700 bg-white dark:bg-slate-950 text-sm mb-4 tabular-nums" />
        <button id="do-ret-micc" class="w-full py-2.5 rounded-xl bg-brand-emerald text-white text-xs font-semibold">${t('تحويل مجاني', 'Transfer Free')}</button>
      `);
      document.getElementById('do-ret-micc').addEventListener('click', () => {
        const micc = Number(document.getElementById('ret-micc').value) || 0;
        if (micc <= 0 || micc > state.safe.micc) { showToast(t('الرصيد غير كافٍ', 'Insufficient balance')); return; }
        safeCapitalOut(micc * MICC_SAR_VALUE);
        state.safe.micc -= micc; state.user.walletMicc += micc;
        state.safe.logs.unshift({ ar: 'تحويل إلى محفظة ميك', en: 'To MiCC Wallet', amount: `-${micc} MiCC` });
        state.walletLogs.unshift({ ar: 'استلام رصيد', en: 'Balance received', amount: `+${micc} MiCC` });
        closeModal(); render(); showToast(t('تم التحويل إلى محفظة ميك', 'Transferred'));
      });
    }

    function simulateMarket(pct) {
      const p = state.safe.prices;
      p.btcUsd = Math.max(1000, p.btcUsd * (1 + pct));
      const h = state.safe.holdings;
      btcLockCheck();
      render();
      showToast(t(`تحديث السوق (${pct > 0 ? '+' : ''}${Math.round(pct * 100)}%)`, `Market (${pct > 0 ? '+' : ''}${Math.round(pct * 100)}%)`));
    }

    // v13.8: compact amount field for the Bitcoin buy/sell windows (16px input to avoid iOS zoom)
    const stkFld = (id, label, extra) => `<label class="block mb-1.5"><span class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-0.5">${label}</span>${extra ? '<div class="flex gap-2">' : ''}<input id="${id}" type="number" inputmode="decimal" min="0" step="any" class="stk-fld ${extra ? 'flex-1 min-w-0' : 'w-full'} px-3 py-1.5 rounded-xl border border-brand-border dark:border-slate-700 bg-white dark:bg-slate-950 text-base tabular-nums" />${extra ? extra + '</div>' : ''}</label>`;
    function openStockTradeModal(assetId, side) {
      if (!SAFE_ACTIVE_ASSETS.has(assetId)) { showToast(t('قريبًا', 'Coming soon')); return; }
      if (safeFrozen()) { showToast(FROZEN_MSG()); return; }
      const p = state.safe.prices;
      const h = state.safe.holdings[assetId];
      const unitPriceSar = p.btcUsd * SAR_PER_USD;
      const avail = state.safe.availableStock.btc;

      if (side === 'buy' && btcLockCheck()) { showToast(BTC_LOCK_MSG()); return; }
      if (side === 'buy') {
        openModal(t('شراء من MiCC Stock', 'Buy from MiCC Stock'), `
          <p class="text-xs text-slate-500 mb-2">${t(`رصيدك: ${fmt(state.safe.micc * MICC_SAR_VALUE, 2)} ريال (${fmt(state.safe.micc, 2)} ميك)`, `Balance: ${fmt(state.safe.micc * MICC_SAR_VALUE, 2)} SAR (${fmt(state.safe.micc, 2)} MiCC)`)}</p>
          ${stkFld('stk-btc', t('بيتكوين', 'Bitcoin'))}${stkFld('stk-sar', t('ريال سعودي', 'Saudi Riyal (SAR)'))}${stkFld('stk-usd', t('دولار أمريكي', 'US Dollar (USD)'))}<div class="mb-3">${stkFld('stk-buy-micc', t('ميك (يُخصم من رصيدك)', 'MiCC (deducted from your balance)'))}</div>
          <button id="do-stk-buy" class="w-full py-2.5 rounded-xl bg-brand-emerald text-white text-xs font-semibold">${t('تنفيذ الشراء', 'Buy')}</button>
        `);
        document.getElementById('modal-backdrop').firstElementChild.classList.add('modal-compact');
        const F = { btc: document.getElementById('stk-btc'), sar: document.getElementById('stk-sar'), usd: document.getElementById('stk-usd'), micc: document.getElementById('stk-buy-micc') };
        const r2 = (n, d) => { const m = Math.pow(10, d); return Math.round(n * m) / m; };
        const fillFromSar = (sar, skip) => {
          const vals = { btc: r2(sar / unitPriceSar, 8), sar: r2(sar, 2), usd: r2(sar / SAR_PER_USD, 2), micc: r2(sar / MICC_SAR_VALUE, 2) };
          Object.keys(F).forEach(k => { if (k !== skip) F[k].value = sar > 0 ? vals[k] : ''; });
        };
        const toSar = { btc: v => v * unitPriceSar, sar: v => v, usd: v => v * SAR_PER_USD, micc: v => v * MICC_SAR_VALUE };
        Object.keys(F).forEach(k => F[k].addEventListener('input', () => { const v = parseFloat(F[k].value); fillFromSar(isNaN(v) ? 0 : toSar[k](v), k); }));
        fillFromSar(Math.min(100, Math.floor(state.safe.micc)) * MICC_SAR_VALUE, null);
        document.getElementById('do-stk-buy').addEventListener('click', () => {
          const spendMicc = Math.round((Number(document.getElementById('stk-buy-micc').value) || 0) * 100) / 100;
          if (spendMicc <= 0 || spendMicc > state.safe.micc) { showToast(t('الرصيد غير كافٍ', 'Insufficient MiCC')); return; }
          const spendSar = spendMicc * MICC_SAR_VALUE;
          const qty = spendSar / unitPriceSar;
          if (qty > avail) { showToast(t('يتجاوز المخزون المتاح', 'Exceeds stock')); return; }
          if (btcLockCheck()) { showToast(BTC_LOCK_MSG()); return; }
          state.safe.micc -= spendMicc;
          state.safe.availableStock.btc -= qty; h.lastBuyPriceUsd = p.btcUsd;
          h.avgSar = (h.qty * (h.avgSar || 0) + spendSar) / (h.qty + qty); // weighted average cost (SAR per unit)
          h.qty += qty; h.costSar += spendSar;
          state.safe.logs.unshift({ ar: 'شراء بيتكوين', en: 'Bought Bitcoin', amount: `-${spendMicc} MiCC` });
          closeModal(); render(); showToast(t('تم الشراء بنجاح', 'Purchased'));
        });
      } else {
        const valueSar = h.qty * unitPriceSar;
        openModal(t('بيع من MiCC Stock', 'Sell from MiCC Stock'), `
          <p class="text-xs text-slate-500 mb-2">${t(`قيمة رصيدك من Bitcoin: ${fmt(valueSar, 2)} ريال (<bdi dir="ltr">${fmt(h.qty, 6)} Bitcoin</bdi>)`, `Your Bitcoin value: ${fmt(valueSar, 2)} SAR (${fmt(h.qty, 6)} Bitcoin)`)}</p>
          ${stkFld('sell-btc', t('بيتكوين', 'Bitcoin'))}${stkFld('sell-sar', t('ريال سعودي', 'Saudi Riyal (SAR)'), `<button id="sell-all" type="button" class="px-3 rounded-xl border border-brand-border dark:border-slate-700 text-xs font-semibold whitespace-nowrap">${t('بيع الكل', 'Sell all')}</button>`)}${stkFld('sell-usd', t('دولار أمريكي', 'US Dollar (USD)'))}${stkFld('sell-micc', t('ميك', 'MiCC'))}
          <div id="sell-quote" class="text-xs space-y-1.5 my-2.5"></div>
          <button id="do-stk-sell" class="w-full py-2.5 rounded-xl bg-brand-navy text-white text-xs font-semibold">${t('تأكيد البيع', 'Confirm Sell')}</button>
        `);
        document.getElementById('modal-backdrop').firstElementChild.classList.add('modal-compact');
        const inp = document.getElementById('sell-sar');
        const SF = { btc: document.getElementById('sell-btc'), sar: inp, usd: document.getElementById('sell-usd'), micc: document.getElementById('sell-micc') };
        const sr2 = (n, d) => { const m = Math.pow(10, d); return Math.round(n * m) / m; };
        const sellFill = (sar, skip) => {
          const vals = { btc: sr2(sar / unitPriceSar, 8), sar: sr2(sar, 2), usd: sr2(sar / SAR_PER_USD, 2), micc: sr2(sar / MICC_SAR_VALUE, 2) };
          Object.keys(SF).forEach(k => { if (k !== skip) SF[k].value = sar > 0 ? vals[k] : ''; });
        };
        const sellToSar = { btc: v => v * unitPriceSar, sar: v => v, usd: v => v * SAR_PER_USD, micc: v => v * MICC_SAR_VALUE };
        let sellAll = true;
        const row = (a, b, cls) => `<div class="flex justify-between gap-3 ${cls || ''}"><span>${a}</span><strong class="tabular-nums text-end">${b}</strong></div>`;
        const SAR = v => `${fmt(v, 2)} ${t('ريال', 'SAR')}`;
        const quote = () => { const v = parseFloat(inp.value); return safeSellQuote(sellAll ? valueSar : (isNaN(v) ? 0 : Math.min(v, valueSar))); };
        const draw = () => {
          const q = quote(), box = document.getElementById('sell-quote');
          if (!q) { box.innerHTML = `<div class="text-slate-500">${t('أدخل مبلغًا أكبر من صفر.', 'Enter an amount greater than zero.')}</div>`; return; }
          box.innerHTML = [
            row(t('نوع البيع:', 'Sale type:'), q.full ? t('خروج كامل', 'Full exit') : t('بيع جزئي', 'Partial sale')),
            row(t('الكمية المباعة:', 'Quantity sold:'), `<bdi dir="ltr">${fmt(q.qty, 6)} Bitcoin</bdi>`),
            row(t('قيمة البيع:', 'Sale value:'), SAR(q.saleSar)),
            row(t('رأس المال المقابل:', 'Matching capital:'), SAR(q.costPart)),
            row(q.profit >= 0 ? t('صافي الربح:', 'Net profit:') : t('الخسارة:', 'Loss:'), SAR(Math.abs(q.profit)), q.profit >= 0 ? 'pl-up' : 'pl-down'),
            row(t('الرسوم (20% من صافي الربح):', 'Fee (20% of net profit):'), q.fee > 0 ? SAR(q.fee) : t('لا رسوم', 'No fee')),
            q.comp > 0 ? row(t('تعويض الحماية (30%):', 'Protection (30%):'), SAR(q.comp), 'text-brand-emerald dark:text-emerald-400') : '',
            (!q.full && q.profit < 0) ? `<div class="p-2 rounded-xl bg-slate-50 dark:bg-slate-950 text-slate-600 dark:text-slate-300">${t('لا تعويض في البيع الجزئي؛ تُطبَّق الحماية عند الخروج الكامل فقط.', 'No compensation on a partial sale; protection applies on a full exit only.')}</div>` : '',
            row(t('صافي المبلغ المستلم:', 'Net amount received:'), `${SAR(q.payout)} <span class="font-normal text-slate-500">(${fmt(q.payoutMicc, 2)} ${MU()})</span>`, 'text-brand-emerald dark:text-emerald-400 border-t border-brand-border dark:border-slate-800 pt-1.5'),
          ].join('');
        };
        Object.keys(SF).forEach(k => SF[k].addEventListener('input', () => { const v = parseFloat(SF[k].value); sellFill(isNaN(v) ? 0 : sellToSar[k](v), k); if (k !== 'sar') inp.value = isNaN(v) || v <= 0 ? '' : (Math.round(sellToSar[k](v) * 100) / 100).toFixed(2); sellAll = false; draw(); }));
        const fillAll = () => { sellFill(Math.floor(valueSar * 100) / 100, null); inp.value = (Math.floor(valueSar * 100) / 100).toFixed(2); };
        document.getElementById('sell-all').addEventListener('click', () => { sellAll = true; fillAll(); draw(); });
        fillAll(); draw();
        document.getElementById('do-stk-sell').addEventListener('click', () => {
          const q = quote();
          if (!q) { showToast(t('أدخل مبلغًا صحيحًا', 'Enter a valid amount')); return; }
          state.safe.availableStock.btc += q.qty;
          // v13.9: full exit at a loss → buying stays locked until the price is back at the previous average buy price
          if (q.full && q.profit < 0 && h.qty > 0 && h.costSar > 0) { h.lockAvgSar = h.costSar / h.qty; h.lockTargetUsd = h.lockAvgSar / SAR_PER_USD; h.locked = true; }
          if (q.full) { h.qty = 0; h.costSar = 0; h.avgSar = 0; }
          else { h.qty -= q.qty; h.costSar = Math.max(0, h.costSar - q.costPart); }
          state.safe.micc += q.payoutMicc;
          const extraAr = (q.fee > 0 ? ` — الرسوم: ${fmt(q.fee, 2)} ريال` : '') + (q.comp > 0 ? ` — تعويض الحماية: ${fmt(q.comp, 2)} ريال` : '');
          const extraEn = (q.fee > 0 ? ` — fee: ${fmt(q.fee, 2)} SAR` : '') + (q.comp > 0 ? ` — protection: ${fmt(q.comp, 2)} SAR` : '');
          state.safe.logs.unshift({ ar: (q.full ? 'بيع Bitcoin (خروج كامل)' : 'بيع Bitcoin (جزئي)') + extraAr, en: (q.full ? 'Sold Bitcoin (full exit)' : 'Sold Bitcoin (partial)') + extraEn, amount: `+${fmt(q.payoutMicc, 2)} MiCC` });
          closeModal(); render(); showToast(q.comp > 0 ? t('تم البيع وتطبيق الحماية', 'Sold with protection applied') : t('تم البيع بنجاح', 'Sold'));
        });
      }
    }

    function accelerateSupport() { openSupportChat('safe'); }

    // ---------- Support chat (v10) ----------
    // Messages are stored in localStorage['supportMessages'] as an array of
    // { id, ts, source: 'safe'|'ami', from: 'user'|'support', user, text, status }.
    // sendSupportMessage() is the single entry point; later it can POST to the admin dashboard backend.
    const SUPPORT_KEY = 'supportMessages';
    let supportChatSource = null;
    function loadSupportMessages() {
      try { const a = JSON.parse(localStorage.getItem(SUPPORT_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
    }
    function saveSupportMessages(list) {
      try { localStorage.setItem(SUPPORT_KEY, JSON.stringify(list)); } catch (e) {}
    }
    function supportUserName() {
      return state.loggedIn ? t(state.user.nameAr, state.user.nameEn) : null;
    }
    function sendSupportMessage(text, source) {
      text = String(text || '').trim();
      if (!text) return null;
      const src = source === 'safe' ? 'safe' : 'ami';
      const list = loadSupportMessages();
      const msg = { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: new Date().toISOString(), source: src, from: 'user', user: supportUserName(), loggedIn: !!state.loggedIn, view: state.view, text, status: 'new' };
      list.push(msg);
      list.push({ id: msg.id + '-r', ts: new Date().toISOString(), source: src, from: 'support', user: null, text: t('تم استلام رسالتك، وسيتواصل معك فريق الدعم قريبًا.', 'We received your message. Our support team will contact you soon.'), auto: true });
      saveSupportMessages(list);
      if (state.loggedIn) { const th = supAddToThread(src, list.slice(-2).map(m => ({ id: m.id, ts: Date.parse(m.ts) || Date.now(), from: m.from, text: m.text, auto: !!m.auto }))); if (th) msg.threadId = th.id; if (state.view === 'supportchats') render(); }
      // TODO(admin dashboard): forward `msg` to backend here, e.g. fetch('/api/support', { method: 'POST', body: JSON.stringify(msg) })
      return msg;
    }
    function escSupport(x) { return String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    // ---- v13.7: support conversations stored in the shared account (ami.shared.v1 → supportThreads) ----
    // Each conversation: { id, source: 'ami'|'safe', createdAt, updatedAt, status: 'open'|'closed', messages: [{ id, ts, from, text, auto }] }.
    // supportMessages (localStorage) stays as the flat feed for the future admin dashboard.
    let supportActiveThreadId = null; // null = latest open thread of the source, '__new__' = start a new one
    let supportViewThreadId = null;   // thread shown on the «محادثاتي مع الدعم» page
    const supThreads = () => Object.values(state.supportThreads || {}).filter(x => x.source === 'safe'); // Safe shows Safe conversations only
    const supLatestOpen = src => supThreads().filter(x => x.source === src && x.status === 'open').sort((a, b) => b.updatedAt - a.updatedAt)[0] || null;
    function supEnsureThreads() {
      if (state.supportThreads && typeof state.supportThreads === 'object') return;
      state.supportThreads = {};
      // one-time import of earlier signed-in chats from this browser
      if (!state.loggedIn) return;
      ['safe'].forEach(src => {
        const old = loadSupportMessages().filter(m => m.source === src && (m.loggedIn || m.from === 'support'));
        if (!old.some(m => m.from === 'user' && m.loggedIn)) return;
        const msgs = old.map(m => ({ id: m.id, ts: Date.parse(m.ts) || Date.now(), from: m.from, text: m.text, auto: !!m.auto }));
        const id = 'th-import-' + src;
        state.supportThreads[id] = { id, source: src, createdAt: msgs[0].ts, updatedAt: msgs[msgs.length - 1].ts, status: 'closed', messages: msgs };
      });
    }
    function supAddToThread(src, msgs) {
      if (!state.loggedIn) return null;
      supEnsureThreads();
      let th = supportActiveThreadId && supportActiveThreadId !== '__new__' ? state.supportThreads[supportActiveThreadId] : null;
      if (th && th.source !== 'safe') th = null;
      if (supportActiveThreadId !== '__new__' && (!th || th.source !== src)) th = supLatestOpen(src);
      if (!th) th = { id: 'th' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), source: src, createdAt: Date.now(), updatedAt: Date.now(), status: 'open', messages: [] };
      th = Object.assign({}, th, { messages: th.messages.concat(msgs), updatedAt: Date.now(), status: 'open' });
      state.supportThreads = Object.assign({}, state.supportThreads, { [th.id]: th });
      supportActiveThreadId = th.id;
      saveShared();
      return th;
    }
    // messages shown in the floating chat
    function supChatMessages() {
      const src = supportChatSource;
      if (!state.loggedIn) return loadSupportMessages().filter(m => m.source === src);
      supEnsureThreads();
      if (supportActiveThreadId === '__new__') return [];
      const a = supportActiveThreadId && state.supportThreads[supportActiveThreadId];
      const th = (a && a.source === 'safe' ? a : null) || supLatestOpen(src);
      return th ? th.messages : [];
    }
    function closeSupportThread(id) {
      const th = state.supportThreads && state.supportThreads[id]; if (!th) return;
      state.supportThreads = Object.assign({}, state.supportThreads, { [id]: Object.assign({}, th, { status: 'closed', updatedAt: Date.now() }) });
      if (supportActiveThreadId === id) supportActiveThreadId = null;
      render();
    }
    function openSupportThread(id) { supportViewThreadId = id; render(); window.scrollTo({ top: 0 }); }
    function continueSupportThread(id) { const th = state.supportThreads && state.supportThreads[id]; if (th && th.source === 'safe') openSupportChat('safe', id); }
    function renderSupportHistory() {
      const card = inner => `<div id="support-history" class="max-w-2xl mx-auto rounded-2xl border border-brand-border dark:border-slate-800 p-4 sm:p-6 bg-white dark:bg-slate-900">
        <h1 class="text-xl font-bold mb-3">${t('محادثاتي مع الدعم', 'My Support Chats')}</h1>${inner}</div>`;
      if (!state.loggedIn) return card(`<p id="sh-guest" class="text-sm text-slate-600 dark:text-slate-300 mb-4">${t('يرجى تسجيل الدخول لعرض محادثاتك مع الدعم.', 'Please sign in to view your support chats.')}</p>
        <button onclick="toggleAuth()" class="px-4 py-2 rounded-xl bg-brand-emerald hover:bg-brand-emeraldHover text-white text-xs font-semibold">${t('تسجيل الدخول', 'Sign In')}</button>`);
      supEnsureThreads();
      const srcLabel = () => 'MiCC Safe';
      const srcCls = s => s === 'safe' ? 'bg-slate-100 text-brand-navy dark:bg-slate-800 dark:text-sky-300' : 'bg-emerald-50 text-brand-emerald dark:bg-emerald-950 dark:text-emerald-300';
      const when = ms => new Date(ms).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const autoTxt = () => t('تم استلام رسالتك، وسيتواصل معك فريق الدعم قريبًا.', 'We received your message. Our support team will contact you soon.');
      const msgText = m => m.auto ? autoTxt() : escSupport(m.text);
      const status = th => `<span class="sh-status px-2 py-0.5 rounded-full text-[10.5px] font-semibold ${th.status === 'open' ? 'bg-amber-50 text-amber-800 dark:bg-amber-950 dark:text-amber-300' : 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400'}">${th.status === 'open' ? t('مفتوحة', 'Open') : t('مغلقة', 'Closed')}</span>`;
      const badge = th => `<span class="sh-source px-2 py-0.5 rounded-full text-[10.5px] font-semibold ${srcCls(th.source)}">${srcLabel(th.source)}</span>`;
      const th = supportViewThreadId && state.supportThreads[supportViewThreadId] && state.supportThreads[supportViewThreadId].source === 'safe' ? state.supportThreads[supportViewThreadId] : null;
      if (th) {
        return card(`
          <button onclick="openSupportThread(null)" class="text-xs font-semibold text-brand-emerald dark:text-emerald-400 mb-3 inline-flex items-center gap-1">${state.lang === 'ar' ? '→' : '←'} ${t('العودة إلى المحادثات', 'Back to chats')}</button>
          <div class="flex flex-wrap items-center gap-2 mb-3">${badge(th)}${status(th)}<span class="text-[11px] text-slate-500 tabular-nums"><bdi dir="ltr">${when(th.createdAt)}</bdi></span></div>
          <div id="sh-thread" class="sc-${th.source === 'safe' ? 'safe' : 'ami'} rounded-2xl border border-brand-border dark:border-slate-800 overflow-hidden mb-4"><div class="sc-list" style="max-height:55vh">${th.messages.map(m => `<div class="sc-msg ${m.from === 'user' ? 'sc-user' : 'sc-bot'}">${msgText(m)}<span class="sc-time"><bdi dir="ltr">${when(m.ts)}</bdi></span></div>`).join('')}</div></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <button id="sh-continue" onclick="continueSupportThread('${th.id}')" class="py-2.5 rounded-xl bg-brand-emerald text-white text-xs font-semibold">${t('متابعة المحادثة', 'Continue chat')}</button>
            ${th.status === 'open' ? `<button onclick="closeSupportThread('${th.id}')" class="py-2.5 rounded-xl border border-brand-border dark:border-slate-700 text-xs font-semibold">${t('إغلاق المحادثة', 'Close chat')}</button>` : ''}
          </div>`);
      }
      const list = supThreads().sort((a, b) => b.updatedAt - a.updatedAt);
      const pageSrc = PAGE === 'safe' ? 'safe' : 'ami';
      return card(`
        <button onclick="supportActiveThreadId = '__new__'; openSupportChat('${pageSrc}', '__new__')" class="mb-4 px-4 py-2 rounded-xl bg-brand-emerald text-white text-xs font-semibold">${t('محادثة جديدة', 'New chat')}</button>
        ${list.length === 0 ? `<div class="rounded-xl border border-dashed border-brand-border dark:border-slate-700 bg-slate-50/70 dark:bg-slate-900/50 py-6 text-center text-xs text-slate-500 dark:text-slate-400">${t('لا توجد محادثات بعد', 'No chats yet')}</div>` :
        `<div id="sh-list" class="space-y-2">${list.map(x => { const last = x.messages[x.messages.length - 1]; return `<button onclick="openSupportThread('${x.id}')" data-thread="${x.id}" class="sh-item w-full text-start rounded-xl border border-brand-border dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/60 p-3">
          <div class="flex flex-wrap items-center gap-2 mb-1">${badge(x)}${status(x)}<span class="ms-auto text-[11px] text-slate-500 tabular-nums"><bdi dir="ltr">${when(x.updatedAt)}</bdi></span></div>
          <div class="sh-last text-xs text-slate-600 dark:text-slate-300 truncate">${last ? (last.from === 'user' ? '' : t('الدعم: ', 'Support: ')) + msgText(last) : ''}</div>
        </button>`; }).join('')}</div>`}`);
    }

    function renderSupportChatList() {
      const box = document.getElementById('sc-list');
      if (!box) return;
      const src = supportChatSource;
      const msgs = supChatMessages();
      const welcome = src === 'safe'
        ? t('أهلًا بك في دعم MiCC Safe. اكتب استفسارك وسنردّ عليك.', 'Welcome to MiCC Safe Support. Type your question and we will get back to you.')
        : t('أهلًا بك في الدعم. اكتب استفسارك وسنردّ عليك.', 'Welcome to Support. Type your question and we will get back to you.');
      const tm = iso => { try { return new Date(iso).toLocaleTimeString(state.lang === 'ar' ? 'ar-SA' : 'en-US', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
      box.innerHTML = `<div class="sc-msg sc-bot">${welcome}</div>` + msgs.map(m => `<div class="sc-msg ${m.from === 'user' ? 'sc-user' : 'sc-bot'}">${m.auto ? t('تم استلام رسالتك، وسيتواصل معك فريق الدعم قريبًا.', 'We received your message. Our support team will contact you soon.') : escSupport(m.text)}<span class="sc-time">${tm(m.ts)}</span></div>`).join('');
      box.scrollTop = box.scrollHeight;
    }
    function openSupportChat(source, threadId) {
      supportChatSource = source === 'safe' ? 'safe' : 'ami';
      closeSupportChat();
      supportActiveThreadId = threadId || null;
      const isSafe = supportChatSource === 'safe';
      const wrap = document.createElement('div');
      wrap.id = 'support-chat';
      wrap.className = 'sc-wrap ' + (isSafe ? 'sc-safe' : 'sc-ami');
      wrap.setAttribute('dir', state.lang === 'ar' ? 'rtl' : 'ltr');
      wrap.setAttribute('role', 'dialog');
      wrap.innerHTML = `<div class="sc-panel">
        <div class="sc-head">
          <span class="sc-av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="2.5" y="13" width="4" height="6" rx="1.5"/><rect x="17.5" y="13" width="4" height="6" rx="1.5"/><path d="M19.5 19a3 3 0 0 1-3 3H13"/></svg></span>
          <div class="min-w-0"><div class="font-bold text-sm leading-tight">${isSafe ? t('دعم MiCC Safe', 'MiCC Safe Support') : t('الدعم الفني', 'Support')}</div><div class="text-[11px] text-white/70">${t('سنردّ عليك في أقرب وقت ممكن', 'We reply as soon as possible')}</div></div>
          <button type="button" class="sc-x sc-mbtn" onclick="minimizeSupportChat()" aria-label="${t('تصغير', 'Minimize')}">—</button>
          <button type="button" class="sc-x" onclick="closeSupportChat()" aria-label="${t('إغلاق', 'Close')}">×</button>
        </div>
        <div id="sc-list" class="sc-list"></div>
        <form id="sc-form" class="sc-form">
          <input id="sc-input" class="sc-in" type="text" maxlength="1000" autocomplete="off" placeholder="${t('اكتب رسالتك...', 'Type your message...')}" />
          <button id="sc-send" type="submit" class="sc-send">${t('إرسال', 'Send')}</button>
        </form>
      </div>
      <button type="button" class="sc-bubble" onclick="restoreSupportChat()" aria-label="${t('فتح المحادثة', 'Open chat')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="sc-dot"></span></button>`;
      wrap.addEventListener('click', e => { if (e.target === wrap) closeSupportChat(); });
      document.body.appendChild(wrap);
      scLockPage(true); scSyncViewport();
      document.getElementById('sc-form').addEventListener('submit', e => {
        e.preventDefault();
        const inp = document.getElementById('sc-input');
        if (sendSupportMessage(inp.value, supportChatSource)) { inp.value = ''; renderSupportChatList(); }
        inp.focus();
      });
      renderSupportChatList();
    }
    function closeSupportChat() { const el = document.getElementById('support-chat'); if (el) { el.remove(); scLockPage(false); } scStopWatch(); }
    // v13.5: minimize / restore (the panel stays in the DOM, so the typed draft and the history are kept)
    let scSeenReplies = 0, scWatchTimer = null;
    const scReplyCount = () => supChatMessages().filter(m => m.from === 'support').length;
    function scStopWatch() { if (scWatchTimer) { clearInterval(scWatchTimer); scWatchTimer = null; } }
    function scCheckNew() {
      const el = document.getElementById('support-chat');
      if (!el || !el.classList.contains('sc-min')) return;
      const b = el.querySelector('.sc-bubble');
      if (b) b.classList.toggle('has-new', scReplyCount() > scSeenReplies);
    }
    function minimizeSupportChat() {
      const el = document.getElementById('support-chat');
      if (!el) return;
      const inp = document.getElementById('sc-input'); if (inp) inp.blur();
      scSeenReplies = scReplyCount();
      el.classList.add('sc-min'); scLockPage(false);
      scStopWatch(); scWatchTimer = setInterval(scCheckNew, 3000);
      scCheckNew();
    }
    function restoreSupportChat() {
      const el = document.getElementById('support-chat');
      if (!el) return;
      el.classList.remove('sc-min');
      const b = el.querySelector('.sc-bubble'); if (b) b.classList.remove('has-new');
      scStopWatch(); scLockPage(true); scSyncViewport(); renderSupportChatList();
    }
    window.addEventListener('storage', e => { if (e.key === SUPPORT_KEY) { scCheckNew(); const el = document.getElementById('support-chat'); if (el && !el.classList.contains('sc-min')) renderSupportChatList(); } });
    // v13.2: keep the chat window inside the visible viewport, just above the on-screen keyboard (iOS Safari)
    function scSyncViewport() {
      const el = document.getElementById('support-chat');
      if (!el) return;
      const vv = window.visualViewport;
      const vw = vv ? vv.width : window.innerWidth, vh = vv ? vv.height : window.innerHeight;
      const left = vv ? vv.offsetLeft : 0, top = vv ? vv.offsetTop : 0;
      const kb = Math.max(0, window.innerHeight - (top + vh)); // space hidden below the visual viewport (keyboard)
      el.style.setProperty('--sc-l', left + 'px');
      el.style.setProperty('--sc-w', vw + 'px');
      el.style.setProperty('--sc-b', kb + 'px');
      el.style.setProperty('--sc-vh', vh + 'px');
    }
    let scSavedOverflow = null;
    function scLockPage(on) {
      const r = document.documentElement, b = document.body;
      if (on && scSavedOverflow === null) { scSavedOverflow = [r.style.overflow, b.style.overflow]; r.style.overflow = 'hidden'; b.style.overflow = 'hidden'; }
      else if (!on && scSavedOverflow !== null) { r.style.overflow = scSavedOverflow[0]; b.style.overflow = scSavedOverflow[1]; scSavedOverflow = null; }
    }
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', scSyncViewport); window.visualViewport.addEventListener('scroll', scSyncViewport); }
    window.addEventListener('resize', scSyncViewport);

    // =========================================================
    // 6. MAIN RENDER & EVENT BINDINGS
    // =========================================================
    // v13.9: welcome / sign-in page — title, subtitle, sign-in, 3 features (tap to reveal), chest
    const SAFE_FEATS = [
      ['سهولة', 'Easy', 'سهولة: شراء وبيع بضغطة واحدة', 'Easy: buy and sell in one tap', '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'],
      ['وضوح', 'Clear', 'وضوح: رصيدك وسجل عملياتك أمامك دائمًا', 'Clear: your balance and history always in view', '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'],
      ['دعم مباشر', 'Live support', 'دعم مباشر: فريق الدعم معك في أي وقت', 'Live support: our team is here anytime', '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'],
    ];
    function safeFeatToggle(i) {
      const line = document.getElementById('sw-line'); if (!line) return;
      const btns = document.querySelectorAll('.sw-feat'); const open = btns[i].classList.contains('on');
      btns.forEach(b => b.classList.remove('on'));
      if (open) { line.classList.add('hidden'); return; }
      btns[i].classList.add('on'); line.textContent = t(SAFE_FEATS[i][2], SAFE_FEATS[i][3]); line.classList.remove('hidden');
    }
    function renderSafeSignedOut() {
      return `<div class="sw-page">
        <div class="safe-welcome max-w-md mx-auto mt-4 rounded-2xl p-5 text-center">
          <h1 class="text-2xl font-bold text-brand-navy dark:text-sky-300 mb-4">MiCC Safe</h1>
          <button onclick="toggleAuth()" class="w-full py-2.5 rounded-xl bg-brand-emerald hover:bg-brand-emeraldHover text-white text-sm font-semibold mb-4">${t('تسجيل الدخول التجريبي الآن', 'Demo Sign In Now')}</button>
          <div class="grid grid-cols-3 gap-2">${SAFE_FEATS.map((x, i) => `<button type="button" class="sw-feat" onclick="safeFeatToggle(${i})"><span class="sw-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${x[4]}</svg></span>${t(x[0], x[1])}</button>`).join('')}</div>
          <div id="sw-line" class="sw-line hidden mt-2"></div>
        </div>
        <div class="sw-chest-wrap">${safeChestHtml()}</div></div>
      `;
    }

    // v13.3: MiCC Safe is for برنامج الرفاقة members only (state.user.membershipActive, shared via ami.shared.v1)
    const safeChestHtml = () => `<div class="flex items-center justify-center pt-5"><div class="w-44 sm:w-56 max-w-[60%]"><img src="${SAFE_CHEST_IMG}" alt="${t('صندوق كنز مفتوح مليء بالعملات الذهبية وسبائك الذهب وعملات Bitcoin وعملات ميك', 'Open treasure chest full of gold coins, gold bars, Bitcoin coins and MiCC coins')}" class="safe-chest" loading="lazy" decoding="async" /></div></div>`;
    function renderSafeMembersOnly() {
      return `
        <div class="max-w-md mx-auto mt-6 rounded-2xl border border-brand-navy/30 dark:border-sky-900/60 bg-white dark:bg-slate-900 p-6 text-center">
          <p class="text-sm font-semibold text-brand-navy dark:text-sky-300">${t('هذه الخدمة متاحة فقط لبرنامج الرفاقة', 'This service is available only to the Companions Program')}</p>
          <button id="demo-activate" onclick="activateDemoMembership()" class="mt-4 w-full py-2.5 rounded-xl border border-brand-emerald text-brand-emerald dark:text-emerald-300 dark:border-emerald-700 text-sm font-semibold">${t('تفعيل العضوية (تجريبي)', 'Activate membership (demo)')}</button>
        </div>
        ${safeChestHtml()}
      `;
    }

    function render() {
      processAutoRenew(); // v13.5: before saving, so a renewal is persisted
      saveShared();
      renderHeader();
      renderFooter();
      const main = document.getElementById('main-content');
      const views = { safe: renderSafe, safeprivacy: renderSafePrivacy, supportchats: renderSupportHistory };
      main.classList.toggle('main-home', state.view === 'home' || state.view === 'store' || !views[state.view]);
      main.classList.toggle('main-welcome', state.view !== 'supportchats' && !state.loggedIn);
      main.innerHTML = state.view === 'supportchats' ? renderSupportHistory() : !state.loggedIn ? renderSafeSignedOut() : !memEver() ? renderSafeMembersOnly() : (views[state.view] || renderSafe)();

      const fcForm = document.getElementById('free-consult-form');
      if (fcForm) fcForm.addEventListener('submit', e => {
        e.preventDefault();
        if (!state.loggedIn) { openLoginGateModal(state.view); return; }
        const val = id => (document.getElementById(id).value || '').trim();
        const errEl = document.getElementById('fc-error');
        const checks = [
          ['fc-name', val('fc-name').length >= 2, t('يرجى إدخال الاسم الكامل أو اسم الجهة.', 'Please enter your full name or organization.')],
          ['fc-phone', /^(\+?966|0)?5\d{8}$/.test(val('fc-phone').replace(/[\s-]/g, '')), t('يرجى إدخال رقم جوال صحيح (05xxxxxxxx).', 'Please enter a valid mobile number (05xxxxxxxx).')],
          ['fc-email', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val('fc-email')), t('يرجى إدخال بريد إلكتروني صحيح.', 'Please enter a valid email address.')],
          ['fc-notes', val('fc-notes').length >= 3, t('يرجى كتابة نبذة مختصرة.', 'Please add a brief note.')],
        ];
        checks.forEach(([id, ok]) => { const el = document.getElementById(id); el.classList.toggle('border-rose-500', !ok); el.setAttribute('aria-invalid', ok ? 'false' : 'true'); });
        const bad = checks.find(c => !c[1]);
        if (bad) { errEl.textContent = bad[2]; errEl.classList.remove('hidden'); document.getElementById(bad[0]).focus(); return; }
        errEl.classList.add('hidden');
        showToast(t('تم استلام طلبك، وسيتواصل معك فريق AMi قريبًا', 'Request received. The AMi team will contact you soon'));
        fcForm.reset();
      });

      const bkForm = document.getElementById('ekc-booking-form');
      if (bkForm) {
        bkForm.addEventListener('submit', e => {
          e.preventDefault();
          const payChecked = document.querySelector('input[name="bk-pay"]:checked');
          if (!payChecked) { showToast(t('يرجى اختيار طريقة الدفع', 'Please choose a payment method')); return; }
          const payMode = payChecked.value;
          if (payMode === 'micc' && !state.user.membershipActive) { showToast(t('متاحة لأعضاء الرفاقة', 'Members only')); return; }
          const offer = state.selectedEkcOffer || { track: EKC_TRACKS[0], opt: EKC_TRACKS[0].options[0] };
          if (payMode === 'micc') {
            const miccNeeded = Math.ceil(offer.opt.priceSar / (MICC_SAR_VALUE * 2));
            if (state.user.walletMicc < miccNeeded) { showToast(t('رصيد ميك غير كافٍ', 'Insufficient MiCC')); return; }
            state.user.walletMicc -= miccNeeded; state.user.walletProgressMicc += miccNeeded; state.user.usedOrTransferred = true;
            state.walletLogs.unshift({ ar: `حجز ${offer.track.titleAr}`, en: `Booked ${offer.track.titleEn}`, amount: `-${miccNeeded} MiCC` });
          }
          showToast(payMode === 'micc' ? t('تم تأكيد الموعد بنجاح', 'Appointment confirmed') : t(`تم تأكيد الموعد — جارٍ تحويلك إلى ${payProviderName(payMode)} لإتمام الدفع`, `Appointment confirmed — redirecting you to ${payProviderName(payMode)} to pay`));
          setView('ekc');
        });
      }


    }

    document.getElementById('brand-btn').addEventListener('click', () => setView(isSafeView() ? 'safe' : 'home'));
    document.querySelectorAll('.nav-link, .drawer-link').forEach(btn => btn.addEventListener('click', () => setView(btn.getAttribute('data-nav'))));
    document.getElementById('side-menu-btn').addEventListener('click', () => document.getElementById('side-drawer-backdrop').classList.remove('hidden'));
    document.getElementById('side-menu-close').addEventListener('click', closeDrawer);
    document.getElementById('side-drawer-backdrop').addEventListener('click', e => { if (e.target.id === 'side-drawer-backdrop') closeDrawer(); });
    document.getElementById('theme-btn').addEventListener('click', () => { state.dark = !state.dark; render(); });
    document.getElementById('lang-btn').addEventListener('click', () => { state.lang = state.lang === 'ar' ? 'en' : 'ar'; render(); });
    document.getElementById('auth-btn').addEventListener('click', toggleAuth);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') closeModal(); });
    document.getElementById('tier-overlay').addEventListener('click', e => { if (e.target.id === 'tier-overlay' || e.target.classList.contains('tg-wrap')) closeTierGuide(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTierGuide(); });

    function applyHashRoute() {
      if (location.hash === '#privacy') setView('safeprivacy');
    }
    window.addEventListener('hashchange', applyHashRoute);

    // v13: keep open tabs of both pages in sync
    window.addEventListener('storage', e => {
      if (e.key !== SHARED_KEY || !e.newValue) return;
      if (!loadShared(e.newValue)) return;
      if (PAGE === 'main' && !state.loggedIn && !PUBLIC_VIEWS.has(state.view)) state.view = 'home';
      const y = window.scrollY; render(); if (window.scrollY !== y) window.scrollTo(0, y);
      const scEl = document.getElementById('support-chat'); if (scEl && !scEl.classList.contains('sc-min')) renderSupportChatList(); scCheckNew();
    });
    window.addEventListener('pageshow', resyncShared);
    window.addEventListener('focus', resyncShared);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) resyncShared(); });
    try { const f = sessionStorage.getItem(FLASH_KEY); if (f) { sessionStorage.removeItem(FLASH_KEY); setTimeout(() => showToast(f), 60); } } catch (e) {}

    render();
    startLive();
    applyHashRoute();
  </script>
</body>
</html>
