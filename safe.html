<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiCC Safe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              emerald: '#0B5C4A',
              emeraldHover: '#084739',
              navy: '#1E3A5F',
              crimson: '#9B1C1C',
              border: '#D9E2EC',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', 'Inter', 'sans-serif';
      -webkit-font-smoothing: antialiased;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    /* Tier cards (bank-card style) */
    .tier-card { position: relative; overflow: hidden; border-radius: 20px; box-shadow: 0 6px 18px -8px rgba(15,23,42,.45), inset 0 1px 0 rgba(255,255,255,.18); }
    .tier-card::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 55%), repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, rgba(255,255,255,0) 2px 9px); }
    .tier-card > * { position: relative; z-index: 1; }
    .tier-classic { background: linear-gradient(135deg, #064E3B 0%, #047857 45%, #10B981 78%, #065F46 100%); color: #FFFFFF; }
    .tier-silver { background: linear-gradient(135deg, #F1F3F6 0%, #B4BCC8 50%, #E1E5EA 100%); color: #111827; }
    .tier-gold { background: linear-gradient(135deg, #F8E08E 0%, #D4A12A 55%, #F3CF6B 100%); color: #3A2705; }
    .tier-platinum { background: linear-gradient(135deg, #1C2026 0%, #3E454E 32%, #8C949E 50%, #4A5159 66%, #23272D 100%); color: #F8FAFC; }
    .tier-diamond { background: radial-gradient(circle at 18% 28%, rgba(255,255,255,.95) 0 1.5px, rgba(255,255,255,0) 2.5px), radial-gradient(circle at 72% 64%, rgba(255,255,255,.9) 0 1.2px, rgba(255,255,255,0) 2.2px), radial-gradient(circle at 88% 22%, rgba(255,255,255,.85) 0 1px, rgba(255,255,255,0) 2px), linear-gradient(135deg, #E6F7FF 0%, #A8DEF7 30%, #F2FBFF 48%, #7FC7EE 68%, #CDEFFF 100%); color: #0A2540; }
    .tier-silver .bg-black\/20, .tier-gold .bg-black\/20, .tier-diamond .bg-black\/20 { background: rgba(255,255,255,.5); }
    .tier-silver .bg-white, .tier-gold .bg-white, .tier-diamond .bg-white { background: #1E293B; }
    .tier-silver .bg-white\/15, .tier-gold .bg-white\/15, .tier-diamond .bg-white\/15, .tier-silver .bg-white\/20, .tier-gold .bg-white\/20, .tier-diamond .bg-white\/20 { background: rgba(15,23,42,.14); }
    .tc-chip { width: 34px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,.25)); border: 1px solid rgba(0,0,0,.18); }
    .tier-silver .tc-chip, .tier-gold .tc-chip, .tier-diamond .tc-chip { background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(120,90,20,.25)); }
    .tc-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); }
    .tier-silver .tc-badge, .tier-gold .tc-badge, .tier-diamond .tc-badge { background: rgba(15,23,42,.12); border-color: rgba(15,23,42,.25); }
    .tc-bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
    .tc-bar > div { height: 100%; border-radius: 999px; background: currentColor; }
    .tier-silver .tc-bar, .tier-gold .tc-bar, .tier-diamond .tc-bar { background: rgba(15,23,42,.15); }
    .tier-card.is-current { box-shadow: 0 0 0 2px #fff, 0 0 0 5px #10B981, 0 10px 24px -8px rgba(16,185,129,.55); }
    .dark .tier-card.is-current { box-shadow: 0 0 0 2px #0F172A, 0 0 0 5px #34D399, 0 10px 24px -8px rgba(52,211,153,.4); }


    /* Compact tier guide cards */
    .tier-card.tier-mini { border-radius: 14px; }
    .tier-mini .tc-chip { width: 26px; height: 20px; border-radius: 5px; }
    .tier-mini .tc-badge { padding: 1px 7px; font-size: 9.5px; }
    .tier-mini .tc-bar { height: 4px; }
    /* Moving shimmer on progress bars */
    .tc-bar > div, .tc-shine { position: relative; overflow: hidden; }
    .tc-bar > div::after, .tc-shine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.65) 50%, rgba(255,255,255,0) 100%); transform: translateX(-100%); animation: tcShine 2.4s ease-in-out infinite; }
    .tier-silver .tc-bar > div::after, .tier-gold .tc-bar > div::after, .tier-diamond .tc-bar > div::after { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%); }
    @keyframes tcShine { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .tc-bar > div::after, .tc-shine::after { animation: none; display: none; } }
    /* MiCC logo coin */
    .micc-coin { border-radius: 999px; object-fit: cover; box-shadow: 0 0 0 1.5px rgba(212,175,55,.75), 0 6px 14px -6px rgba(0,0,0,.55); background: #111; }
    /* MiCC Safe hero (navy + gold) */
    .safe-hero { position: relative; overflow: hidden; color: #fff; border: 1px solid rgba(212,175,55,.35); background: radial-gradient(110% 80% at 100% 0%, rgba(212,175,55,.30) 0%, rgba(212,175,55,0) 55%), linear-gradient(135deg, #0A1A31 0%, #13294B 55%, #0B1A30 100%); box-shadow: 0 14px 30px -14px rgba(10,26,49,.7); }
    .safe-hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(120deg, rgba(212,175,55,.06) 0 1px, rgba(212,175,55,0) 1px 14px); }
    .safe-hero::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 999px; inset-inline-end: -70px; bottom: -110px; border: 1px solid rgba(212,175,55,.22); box-shadow: 0 0 0 18px rgba(212,175,55,.04), 0 0 0 40px rgba(212,175,55,.03); pointer-events: none; }
    .safe-hero > * { position: relative; z-index: 1; }
    .gold-text { color: #E9C46A; }
    .btn-gold { background: linear-gradient(135deg, #F3D98B 0%, #D4AF37 55%, #B8912A 100%); color: #0A1A31; }
    .btn-ghost-gold { border: 1px solid rgba(233,196,106,.45); background: rgba(255,255,255,.05); color: #fff; }
    /* Asset cards with emblems */
    .asset-card { position: relative; overflow: hidden; border: 1px solid #E5E7EB; background: #fff; }
    .asset-card::before { content: ""; position: absolute; top: 0; inset-inline: 0; height: 3px; background: linear-gradient(90deg, #B8912A, #F3D98B, #B8912A); }
    .dark .asset-card { border-color: #1E293B; background: #0F172A; }
    .asset-emblem { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: #E9C46A; background: radial-gradient(circle at 30% 25%, #1F3B66 0%, #0A1A31 75%); box-shadow: inset 0 0 0 1.5px rgba(212,175,55,.7), 0 6px 14px -8px rgba(10,26,49,.8); }
    .asset-emblem svg { width: 58%; height: 58%; }
    .btn-navy { background: #13294B; color: #fff; }
    .dark .btn-navy { background: #1E3A64; }
    .btn-outline-gold { border: 1px solid #C9A23A; color: #8A6A16; background: transparent; }
    .dark .btn-outline-gold { color: #E9C46A; border-color: rgba(233,196,106,.6); }


    /* Tier guide: Apple-Wallet style stack */
    .tg-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(2,6,23,.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .tg-wrap { --tw: min(72vw, 270px); width: var(--tw); margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 0 28px; }
    .tg-slot { position: relative; height: 60px; transition: height .28s ease; }
    .tg-slot.is-open { height: calc(var(--tw) / 1.586 + 10px); }
    .tg-slot > .tier-card { position: absolute; top: 0; inset-inline: 0; z-index: 0; isolation: isolate; cursor: pointer; }
    .tier-card.tg-card { aspect-ratio: 1.586 / 1; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; box-shadow: 0 -4px 14px -6px rgba(0,0,0,.55), 0 10px 22px -10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.22); }
    .tg-card .tc-chip { width: 28px; height: 21px; border-radius: 5px; }
    .tg-card .tc-badge { padding: 1px 7px; font-size: 9.5px; }
    .tg-card .tc-bar { height: 4px; }
    .tg-logo { width: 22px; height: 22px; }
    .tier-card.tg-card.is-current { box-shadow: 0 0 0 2px #34D399, 0 10px 24px -8px rgba(52,211,153,.55); }
    .tier-diamond.tg-card { box-shadow: 0 -4px 14px -6px rgba(0,0,0,.5), 0 10px 26px -8px rgba(127,199,238,.6), inset 0 1px 0 rgba(255,255,255,.7); }
    /* Inline tier guide grid (v8) */
    .tg-grid { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 100%; margin-inline: auto; }
    .tg-grid .tier-card.tg-card { flex: none; width: 170px; aspect-ratio: 1.586 / 1; border-radius: 11px; padding: 9px 11px; cursor: default; box-shadow: 0 8px 18px -10px rgba(15,23,42,.55), inset 0 1px 0 rgba(255,255,255,.22); }
    .tg-grid .tier-card.tg-card.is-current { box-shadow: 0 0 0 3px #dc2626, 0 0 18px 2px rgba(220,38,38,.45), 0 10px 22px -10px rgba(15,23,42,.55); }
    .dark .tg-grid .tier-card.tg-card.is-current { box-shadow: 0 0 0 3px #ef4444, 0 0 20px 3px rgba(239,68,68,.45), 0 10px 22px -10px rgba(0,0,0,.6); }
    .tg-grid .tc-chip { width: 22px; height: 16px; border-radius: 4px; }
    .tg-grid .tg-logo { width: 18px; height: 18px; }
    .tg-grid .tc-badge { padding: 1px 6px; font-size: 8.5px; gap: 2px; white-space: nowrap; }
    .tg-grid .tc-bar { height: 3px; }
    .tg-grid .tier-card.tg-card > * { position: relative; z-index: 1; }
    /* Safe card actions (v10): three equal gold-framed tiles */
    .safe-acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: stretch; }
    .safe-act { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; min-height: 96px; padding: 10px 4px 9px; border-radius: 14px; text-align: center; color: #fff; border: 1px solid transparent; background: linear-gradient(160deg, rgba(31,59,102,.92), rgba(10,26,49,.94)) padding-box, linear-gradient(135deg, #F3D98B 0%, #B8912A 45%, #F3D98B 100%) border-box; box-shadow: 0 8px 18px -12px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); transition: transform .15s ease, box-shadow .15s ease; }
    .safe-act:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -12px rgba(212,175,55,.55), inset 0 1px 0 rgba(255,255,255,.1); }
    .safe-act:active { transform: translateY(0); }
    .safe-act .sa-ic { width: 32px; height: 32px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: #0A1A31; background: linear-gradient(135deg, #F3D98B 0%, #D4AF37 55%, #B8912A 100%); box-shadow: 0 0 0 3px rgba(212,175,55,.15); }
    .safe-act .sa-ic svg { width: 17px; height: 17px; }
    /* v11: muted icon tones per action (frames stay gold) */
    .safe-act .sa-ic.sa-ic-blue { color: #fff; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.85) 0%, rgba(255,255,255,.28) 22%, rgba(255,255,255,0) 46%), linear-gradient(135deg, #C9A2F2 0%, #8E4FD6 55%, #5E2A9E 100%); box-shadow: inset 0 1.5px 2px rgba(255,255,255,.65), inset 0 -3px 5px rgba(0,0,0,.28), 0 0 0 3px rgba(142,79,214,.28), 0 3px 8px -2px rgba(0,0,0,.45); }
    .safe-act .sa-ic.sa-ic-red { color: #fff; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.85) 0%, rgba(255,255,255,.28) 22%, rgba(255,255,255,0) 46%), linear-gradient(135deg, #FFC48A 0%, #F28A25 55%, #C25E0A 100%); box-shadow: inset 0 1.5px 2px rgba(255,255,255,.65), inset 0 -3px 5px rgba(0,0,0,.28), 0 0 0 3px rgba(242,138,37,.28), 0 3px 8px -2px rgba(0,0,0,.45); }
    .safe-act .sa-ic.sa-ic-green { color: #fff; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.85) 0%, rgba(255,255,255,.28) 22%, rgba(255,255,255,0) 46%), linear-gradient(135deg, #93D3B4 0%, #3E9A74 55%, #23704F 100%); box-shadow: inset 0 1.5px 2px rgba(255,255,255,.65), inset 0 -3px 5px rgba(0,0,0,.28), 0 0 0 3px rgba(62,154,116,.28), 0 3px 8px -2px rgba(0,0,0,.45); }
    .safe-act .sa-lb { font-size: 11.5px; font-weight: 700; line-height: 1.25; }
    .safe-act .sa-sub { margin-top: auto; font-size: 9.5px; font-weight: 600; line-height: 1.2; color: #E9C46A; }
    /* Footers (v10) */
    .ami-footer { background: linear-gradient(180deg, #0B3D2E 0%, #062A1F 100%); border-top: 2px solid #D4AF37; }
    .safe-footer { background: #1E3A5F; border-top: 0; }
    .dark .ami-footer { background: linear-gradient(180deg, #08301F 0%, #04231A 100%); }
    /* Support chat (v10) */
    /* v13.1: support chat = small floating window in a bottom corner (all screen sizes) */
    /* v13.2: chat stays inside the visible viewport (iOS keyboard): --sc-l/--sc-w/--sc-b/--sc-vh are set from visualViewport in JS */
    .sc-wrap { position: fixed; z-index: 70; pointer-events: none; box-sizing: border-box; left: calc(var(--sc-l, 0px) + 16px); width: calc(var(--sc-w, 100vw) - 32px); bottom: calc(var(--sc-b, 0px) + 16px); display: flex; justify-content: flex-end; transform: none; }
    .sc-panel { pointer-events: auto; box-sizing: border-box; width: min(320px, 82vw); max-width: 100%; height: min(460px, 50vh); max-height: calc(var(--sc-vh, 100vh) - 32px); display: flex; flex-direction: column; overflow: hidden; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px -12px rgba(0,0,0,.55), 0 0 0 1px rgba(15,23,42,.08); }
    .dark .sc-panel { background: #0F172A; }
    .sc-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: #fff; border-bottom: 2px solid #D4AF37; }
    .sc-safe .sc-head { background: linear-gradient(135deg, #0A1A31 0%, #13294B 60%, #1E3A5F 100%); }
    .sc-ami .sc-head { background: linear-gradient(135deg, #04231A 0%, #0B3D2E 60%, #0E4A37 100%); }
    .sc-av { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: #0A1A31; background: linear-gradient(135deg, #F3D98B, #D4AF37 55%, #B8912A); }
    .sc-av svg { width: 19px; height: 19px; }
    .sc-x { margin-inline-start: auto; width: 32px; height: 32px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,.1); color: #fff; font-size: 18px; line-height: 1; }
    .sc-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #F8FAFC; }
    .dark .sc-list { background: #020617; }
    .sc-msg { max-width: 82%; padding: 8px 11px; border-radius: 14px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .sc-msg .sc-time { display: block; margin-top: 3px; font-size: 9.5px; opacity: .65; }
    .sc-user { align-self: flex-end; color: #fff; border-end-end-radius: 4px; }
    .sc-safe .sc-user { background: #13294B; }
    .sc-ami .sc-user { background: #0B3D2E; }
    .sc-bot { align-self: flex-start; color: #0F172A; background: #fff; border: 1px solid #E5E7EB; border-end-start-radius: 4px; }
    .dark .sc-bot { color: #E2E8F0; background: #1E293B; border-color: #334155; }
    .sc-form { display: flex; align-items: stretch; gap: 8px; box-sizing: border-box; width: 100%; flex: none; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #E5E7EB; background: #fff; }
    .dark .sc-form { background: #0F172A; border-color: #1E293B; }
    .sc-in { flex: 1 1 auto; width: 0; min-width: 0; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; font-size: 16px; /* >=16px: no iOS auto-zoom */ border: 1px solid #CBD5E1; background: #fff; color: #0F172A; }
    .dark .sc-in { background: #020617; border-color: #334155; color: #E2E8F0; }
    .sc-in:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(212,175,55,.2); }
    .sc-send { flex: 0 0 auto; white-space: nowrap; padding: 0 16px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #0A1A31; background: linear-gradient(135deg, #F3D98B 0%, #D4AF37 55%, #B8912A 100%); }
    /* Gold Bitcoin coin logo (v9) */
    .btc-coin { flex-shrink: 0; border-radius: 999px; object-fit: cover; box-shadow: 0 0 0 1px rgba(212,175,55,.55), 0 6px 14px -6px rgba(0,0,0,.5); }
    .safe-dash-total.on-navy .pl-up { color: #34D399; } .safe-dash-total.on-navy .pl-down { color: #F87171; }
    /* Safe reserve block (v9) */
    .safe-reserve { border: 1px solid rgba(212,175,55,.45); background: linear-gradient(180deg, #FFFBEB 0%, #fff 70%); }
    .dark .safe-reserve { border-color: rgba(212,175,55,.35); background: linear-gradient(180deg, #14213A 0%, #0F172A 70%); }
    .demo-tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; background: #FEF3C7; color: #92400E; border: 1px solid #FCD34D; }
    .dark .demo-tag { background: rgba(146,64,14,.25); color: #FCD34D; border-color: rgba(252,211,77,.4); }
    /* Company assets — dark green & gold, serif display (v9) */
    .co-serif { font-family: 'Amiri', 'Playfair Display', 'Times New Roman', Georgia, serif; font-variant-numeric: lining-nums tabular-nums; }
    [dir="ltr"] .co-serif, .co-serif[dir="ltr"] { font-family: 'Playfair Display', 'Amiri', Georgia, 'Times New Roman', serif; }
    .co-hero { position: relative; overflow: hidden; color: #F8F5EA; border: 1px solid rgba(212,175,55,.55); background: radial-gradient(90% 70% at 0% 0%, rgba(212,175,55,.22) 0%, rgba(212,175,55,0) 60%), linear-gradient(160deg, #04231A 0%, #0B3D2E 55%, #062A1F 100%); box-shadow: 0 16px 32px -16px rgba(4,35,26,.75); }
    .co-hero::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(212,175,55,.35); border-radius: 18px; pointer-events: none; }
    .co-hero > * { position: relative; z-index: 1; }
    .co-rule { height: 1px; background: linear-gradient(90deg, rgba(212,175,55,0), #D4AF37, rgba(212,175,55,0)); }
    .co-gold { color: #E3C26B; }
    .co-card { position: relative; border: 1px solid #CDBF8F; background: #FBF8EE; border-radius: 18px; }
    .co-card::before { content: ""; position: absolute; top: 0; inset-inline: 18px; height: 3px; border-radius: 0 0 4px 4px; background: linear-gradient(90deg, #0B3D2E, #D4AF37, #0B3D2E); }
    .dark .co-card { border-color: rgba(212,175,55,.35); background: #062419; }
    .co-cell { border-top: 1px dashed #D6C89A; }
    .dark .co-cell { border-top-color: rgba(212,175,55,.25); }
    .co-label { color: #4B6358; } .dark .co-label { color: #9DB8AA; }
    .co-title { color: #0B3D2E; } .dark .co-title { color: #F1E3B3; }
    .co-emblem { box-shadow: 0 0 0 2px #0B3D2E, 0 0 0 3.5px #D4AF37, 0 6px 14px -6px rgba(0,0,0,.5); }
    /* Disabled (coming soon) assets */
    .asset-soon { filter: grayscale(1); opacity: .55; }
    .soon-badge { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; background: #E2E8F0; color: #475569; }
    .dark .soon-badge { background: #1E293B; color: #94A3B8; }
    .pl-up { color: #059669; } .dark .pl-up { color: #34D399; }
    .pl-down { color: #DC2626; } .dark .pl-down { color: #F87171; }
    /* Sales metric (not an asset) */
    .sales-metric { border: 1.5px dashed #CBD5E1; background: repeating-linear-gradient(135deg, #F8FAFC 0 10px, #F1F5F9 10px 20px); }
    .dark .sales-metric { border-color: #334155; background: repeating-linear-gradient(135deg, #0B1220 0 10px, #0F172A 10px 20px); }
    /* Safe dashboard */
    .safe-dash { border: 1px solid #E5E7EB; background: #fff; }
    .dark .safe-dash { border-color: #1E293B; background: #0F172A; }
    .safe-dash-total { background: linear-gradient(135deg, #0A1A31 0%, #13294B 100%); color: #fff; border: 1px solid rgba(212,175,55,.35); }

    // ---- Live market data (falls back silently to static values) ----
    const LIVE_REFRESH_MS = 45000;
    const live = { on: false, updatedAt: null };

    async function liveJson(url) {
      const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = setTimeout(() => ctrl && ctrl.abort(), 9000);
      try {
        const r = await fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
        if (!r.ok) throw new Error('http ' + r.status);
        return await r.json();
      } finally { clearTimeout(timer); }
    }
    const okNum = (v, lo, hi) => { const n = Number(v); return isFinite(n) && n > lo && n < hi ? n : null; };

    async function refreshLive() {
      if (typeof fetch !== 'function') return;
      let btcUsd = null;
      try { const j = await liveJson('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd'); btcUsd = okNum(j && j.bitcoin && j.bitcoin.usd, 1000, 1e7); } catch (e) {}
      if (!btcUsd) { try { const j = await liveJson('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT'); btcUsd = okNum(j && j.price, 1000, 1e7); } catch (e) {} }
      if (!btcUsd) { try { const j = await liveJson('https://api.coinbase.com/v2/prices/BTC-USD/spot'); btcUsd = okNum(j && j.data && j.data.amount, 1000, 1e7); } catch (e) {} }
      if (btcUsd) {
        state.safe.prices.btcUsd = btcUsd;
        live.on = true; live.updatedAt = new Date();
        if (state.view === 'safe') { const y = window.scrollY; render(); if (window.scrollY !== y) window.scrollTo(0, y); }
      }
    }
    function liveBadge(dark) {
      const tm = live.updatedAt ? live.updatedAt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
      return `<span class="inline-flex items-center gap-1.5 text-[10.5px] font-semibold ${dark ? 'text-white/75' : 'text-slate-500 dark:text-slate-400'}"><span class="live-dot ${live.on ? 'on' : ''}"></span>${live.on ? `${t('مباشر', 'Live')} · <span class="tabular-nums" dir="ltr">${tm}</span>` : t('أسعار مرجعية', 'Reference prices')}</span>`;
    }
    function startLive() {
      if (typeof fetch !== 'function' || window.__liveStarted) return;
      window.__liveStarted = true;
      refreshLive();
      setInterval(() => { if (!document.hidden) refreshLive(); }, LIVE_REFRESH_MS);
      document.addEventListener('visibilitychange', () => { if (!document.hidden && (!live.updatedAt || Date.now() - live.updatedAt.getTime() > LIVE_REFRESH_MS)) refreshLive(); });
    }

    function getNextTier() {
      const cur = getCurrentTier();
      const idx = TIERS.findIndex(x => x.id === cur.id);
      return idx < TIERS.length - 1 ? TIERS[idx + 1] : null;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function openModal(title, bodyHtml) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function closeDrawer() {
      document.getElementById('side-drawer-backdrop').classList.add('hidden');
    }

    function openLoginGateModal(pendingView) {
      openModal(t('تسجيل الدخول مطلوب', 'Sign In Required'), `
        <p class="text-sm text-slate-600 dark:text-slate-300 mb-4">
          ${pendingView === 'safe' ? t('يرجى تسجيل الدخول للمتابعة.', 'Please sign in to continue.') : t('لإتمام الحجز أو الشراء أو الوصول إلى محفظة ميك، يرجى تسجيل الدخول أولاً.', 'Please sign in to book, buy, or access your wallet.')}
        </p>
        <button id="gate-login-btn" class="w-full py-2.5 rounded-xl bg-brand-emerald hover:bg-brand-emeraldHover text-white text-sm font-semibold">
          ${t('تسجيل الدخول التجريبي الآن', 'Demo Sign In Now')}
        </button>
      `);
      document.getElementById('gate-login-btn').addEventListener('click', () => {
        state.loggedIn = true;
        closeModal();
        showToast(t('تم تسجيل الدخول التجريبي بنجاح', 'Signed in to demo account'));
        if (pendingView) state.view = pendingView;
        render();
        if (pendingView === 'safe') { window.scrollTo({ top: 0 }); }
      });
    }

    function setView(viewName) {

    function simulateMarket(pct) {
      const p = state.safe.prices;
      p.btcUsd = Math.max(1000, p.btcUsd * (1 + pct));
      const h = state.safe.holdings;
      if (h.btc.locked && p.btcUsd >= h.btc.lockTargetUsd) h.btc.locked = false;
      render();
      showToast(t(`تحديث السوق (${pct > 0 ? '+' : ''}${Math.round(pct * 100)}%)`, `Market (${pct > 0 ? '+' : ''}${Math.round(pct * 100)}%)`));
    }

    function openStockTradeModal(assetId, side) {
      if (!SAFE_ACTIVE_ASSETS.has(assetId)) { showToast(t('قريبًا', 'Coming soon')); return; }
      const p = state.safe.prices;
      const h = state.safe.holdings[assetId];
      const unitPriceSar = p.btcUsd * SAR_PER_USD;
      const avail = state.safe.availableStock.btc;

      if (side === 'buy') {
        openModal(t('شراء في MiCC Stock (0% رسوم)', 'Buy in MiCC Stock (0% Fee)'), `
          <p class="text-xs text-slate-500 mb-3">${t(`رصيدك: ${fmt(state.safe.micc, 2)} ميك`, `Balance: ${fmt(state.safe.micc, 2)} MiCC`)}</p>
          <label class="block mb-2"><span class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">${t('بيتكوين (BTC)', 'Bitcoin (BTC)')}</span><input id="stk-btc" type="number" inputmode="decimal" min="0" step="any" class="stk-fld w-full px-3 py-2 rounded-xl border border-brand-border dark:border-slate-700 bg-white dark:bg-slate-950 text-sm tabular-nums" /></label><label class="block mb-2"><span class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">${t('ريال سعودي', 'Saudi Riyal (SAR)')}</span><input id="stk-sar" type="number" inputmode="decimal" min="0" step="any" class="stk-fld w-full px-3 py-2 rounded-xl border border-brand-border dark:border-slate-700 bg-white dark:bg-slate-950 text-sm tabular-nums" /></label><label class="block mb-2"><span class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">${t('دولار أمريكي', 'US Dollar (USD)')}</span><input id="stk-usd" type="number" inputmode="decimal" min="0" step="any" class="stk-fld w-full px-3 py-2 rounded-xl border border-brand-border dark:border-slate-700 bg-white dark:bg-slate-950 text-sm tabular-nums" /></label><div class="mb-4"><label class="block mb-2"><span class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">${t('ميك (المخصوم من رصيدك)', 'MiCC (deducted from your balance)')}</span><input id="stk-buy-micc" type="number" inputmode="decimal" min="0" step="any" class="stk-fld w-full px-3 py-2 rounded-xl border border-brand-border dark:border-slate-700 bg-white dark:bg-slate-950 text-sm tabular-nums" /></label></div>
          <button id="do-stk-buy" class="w-full py-2.5 rounded-xl bg-brand-emerald text-white text-xs font-semibold">${t('تنفيذ الشراء', 'Buy')}</button>
        `);
        const F = { btc: document.getElementById('stk-btc'), sar: document.getElementById('stk-sar'), usd: document.getElementById('stk-usd'), micc: document.getElementById('stk-buy-micc') };
        const r2 = (n, d) => { const m = Math.pow(10, d); return Math.round(n * m) / m; };
        const fillFromSar = (sar, skip) => {
          const vals = { btc: r2(sar / unitPriceSar, 8), sar: r2(sar, 2), usd: r2(sar / SAR_PER_USD, 2), micc: r2(sar / MICC_SAR_VALUE, 2) };
          Object.keys(F).forEach(k => { if (k !== skip) F[k].value = sar > 0 ? vals[k] : ''; });
        };
        const toSar = { btc: v => v * unitPriceSar, sar: v => v, usd: v => v * SAR_PER_USD, micc: v => v * MICC_SAR_VALUE };
        Object.keys(F).forEach(k => F[k].addEventListener('input', () => { const v = parseFloat(F[k].value); fillFromSar(isNaN(v) ? 0 : toSar[k](v), k); }));
        fillFromSar(Math.min(100, Math.floor(state.safe.micc)) * MICC_SAR_VALUE, null);
        document.getElementById('do-stk-buy').addEventListener('click', () => {
          const spendMicc = Math.round((Number(document.getElementById('stk-buy-micc').value) || 0) * 100) / 100;
          if (spendMicc <= 0 || spendMicc > state.safe.micc) { showToast(t('الرصيد غير كافٍ', 'Insufficient MiCC')); return; }
          const spendSar = spendMicc * MICC_SAR_VALUE;
          const qty = spendSar / unitPriceSar;
          if (qty > avail) { showToast(t('يتجاوز المخزون المتاح', 'Exceeds stock')); return; }
          state.safe.micc -= spendMicc;
          state.safe.availableStock.btc -= qty; h.lastBuyPriceUsd = p.btcUsd;
          h.avgSar = (h.qty * (h.avgSar || 0) + spendSar) / (h.qty + qty); // weighted average cost (SAR per unit)
          h.qty += qty; h.costSar += spendSar;
          state.safe.logs.unshift({ ar: `شراء ${assetId.toUpperCase()}`, en: `Bought ${assetId.toUpperCase()}`, amount: `-${spendMicc} MiCC` });
          closeModal(); render(); showToast(t('تم الشراء بنجاح', 'Purchased'));
        });
      } else {
        const currentValSar = h.qty * unitPriceSar;
        const origCost = h.costSar;
        let payoutSar = currentValSar;
        let compensated = false;
        if (currentValSar < origCost) {
          payoutSar = Math.max(currentValSar, origCost * 0.90);
          compensated = true;
        }
        const payoutMicc = payoutSar / MICC_SAR_VALUE;
        openModal(t('بيع في MiCC Stock', 'Sell in MiCC Stock'), `
          <div class="text-xs space-y-2 mb-4">
            <div class="flex justify-between"><span>${t('رأس المال:', 'Capital:')}</span><strong class="tabular-nums">${fmt(origCost, 0)} ${t('ريال', 'SAR')}</strong></div>
            <div class="flex justify-between"><span>${t('القيمة الحالية:', 'Current:')}</span><strong class="tabular-nums">${fmt(currentValSar, 0)} ${t('ريال', 'SAR')}</strong></div>
            <div class="flex justify-between text-brand-emerald dark:text-emerald-400"><span>${t('المسترد:', 'Payout:')}</span><strong class="tabular-nums">${fmt(payoutSar, 0)} ${t('ريال', 'SAR')} (${fmt(payoutMicc, 2)} ${MU()})</strong></div>
            ${compensated ? `<div class="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-brand-emerald dark:text-emerald-300 font-semibold">${t('تم التعويض: حماية الهبوط 10% — سيُقفل الشراء حتى عودة السعر لمستوى الشراء الأول.', 'Compensated: 10% protection applied — repurchase locks until price recovers.')}</div>` : ''}
          </div>
          <button id="do-stk-sell" class="w-full py-2.5 rounded-xl bg-brand-navy text-white text-xs font-semibold">${t('تأكيد البيع', 'Confirm Sell')}</button>
        `);
        document.getElementById('do-stk-sell').addEventListener('click', () => {
          state.safe.availableStock.btc += h.qty; if (compensated) { h.locked = true; h.lockTargetUsd = h.lastBuyPriceUsd; }
          state.safe.micc += payoutMicc; h.qty = 0; h.costSar = 0; h.avgSar = 0;
          state.safe.logs.unshift({ ar: compensated ? `بيع ${assetId.toUpperCase()} (تم التعويض 10%)` : `بيع ${assetId.toUpperCase()}`, en: compensated ? `Sold ${assetId.toUpperCase()} (Compensated)` : `Sold ${assetId.toUpperCase()}`, amount: `+${fmt(payoutMicc, 2)} MiCC` });
          closeModal(); render(); showToast(compensated ? t('تم البيع وتعويض الـ 10%', 'Sold with 10% protection') : t('تم البيع بنجاح', 'Sold'));
        });
      }
    }

    function accelerateSupport() { openSupportChat('safe'); }

    // ---------- Support chat (v10) ----------
    // Messages are stored in localStorage['supportMessages'] as an array of
    // { id, ts, source: 'safe'|'ami', from: 'user'|'support', user, text, status }.
    // sendSupportMessage() is the single entry point; later it can POST to the admin dashboard backend.
    const SUPPORT_KEY = 'supportMessages';
    let supportChatSource = null;
    function loadSupportMessages() {
      try { const a = JSON.parse(localStorage.getItem(SUPPORT_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
    }
    function saveSupportMessages(list) {
      try { localStorage.setItem(SUPPORT_KEY, JSON.stringify(list)); } catch (e) {}
    }
    function supportUserName() {
      return state.loggedIn ? t(state.user.nameAr, state.user.nameEn) : null;
    }
    function sendSupportMessage(text, source) {
      text = String(text || '').trim();
      if (!text) return null;
      const src = source === 'safe' ? 'safe' : 'ami';
      const list = loadSupportMessages();
      const msg = { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: new Date().toISOString(), source: src, from: 'user', user: supportUserName(), loggedIn: !!state.loggedIn, view: state.view, text, status: 'new' };
      list.push(msg);
      list.push({ id: msg.id + '-r', ts: new Date().toISOString(), source: src, from: 'support', user: null, text: t('تم استلام رسالتك، وبيتواصل معك فريق الدعم قريبًا.', 'We received your message. Our support team will contact you soon.'), auto: true });
      saveSupportMessages(list);
      // TODO(admin dashboard): forward `msg` to backend here, e.g. fetch('/api/support', { method: 'POST', body: JSON.stringify(msg) })
      return msg;
    }
    function escSupport(x) { return String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function renderSupportChatList() {
      const box = document.getElementById('sc-list');
      if (!box) return;
      const src = supportChatSource;
      const msgs = loadSupportMessages().filter(m => m.source === src);
      const welcome = src === 'safe'
        ? t('أهلًا بك في دعم MiCC Safe. اكتب استفسارك وبنرد عليك.', 'Welcome to MiCC Safe Support. Type your question and we will get back to you.')
        : t('أهلًا بك في الدعم. اكتب استفسارك وبنرد عليك.', 'Welcome to Support. Type your question and we will get back to you.');
      const tm = iso => { try { return new Date(iso).toLocaleTimeString(state.lang === 'ar' ? 'ar-SA' : 'en-US', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
      box.innerHTML = `<div class="sc-msg sc-bot">${welcome}</div>` + msgs.map(m => `<div class="sc-msg ${m.from === 'user' ? 'sc-user' : 'sc-bot'}">${m.auto ? t('تم استلام رسالتك، وبيتواصل معك فريق الدعم قريبًا.', 'We received your message. Our support team will contact you soon.') : escSupport(m.text)}<span class="sc-time">${tm(m.ts)}</span></div>`).join('');
      box.scrollTop = box.scrollHeight;
    }
    function openSupportChat(source) {
      supportChatSource = source === 'safe' ? 'safe' : 'ami';
      closeSupportChat();
      const isSafe = supportChatSource === 'safe';
      const wrap = document.createElement('div');
      wrap.id = 'support-chat';
      wrap.className = 'sc-wrap ' + (isSafe ? 'sc-safe' : 'sc-ami');
      wrap.setAttribute('dir', state.lang === 'ar' ? 'rtl' : 'ltr');
      wrap.setAttribute('role', 'dialog');
      wrap.innerHTML = `<div class="sc-panel">
        <div class="sc-head">
          <span class="sc-av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="2.5" y="13" width="4" height="6" rx="1.5"/><rect x="17.5" y="13" width="4" height="6" rx="1.5"/><path d="M19.5 19a3 3 0 0 1-3 3H13"/></svg></span>
          <div class="min-w-0"><div class="font-bold text-sm leading-tight">${isSafe ? t('دعم MiCC Safe', 'MiCC Safe Support') : t('الدعم الفني', 'Support')}</div><div class="text-[11px] text-white/70">${t('نرد عليك في أقرب وقت', 'We reply as soon as possible')}</div></div>
          <button type="button" class="sc-x" onclick="closeSupportChat()" aria-label="${t('إغلاق', 'Close')}">×</button>
        </div>
        <div id="sc-list" class="sc-list"></div>
        <form id="sc-form" class="sc-form">
          <input id="sc-input" class="sc-in" type="text" maxlength="1000" autocomplete="off" placeholder="${t('اكتب رسالتك...', 'Type your message...')}" />
          <button id="sc-send" type="submit" class="sc-send">${t('إرسال', 'Send')}</button>
        </form>
      </div>`;
      wrap.addEventListener('click', e => { if (e.target === wrap) closeSupportChat(); });
      document.body.appendChild(wrap);
      scLockPage(true); scSyncViewport();
      document.getElementById('sc-form').addEventListener('submit', e => {
        e.preventDefault();
        const inp = document.getElementById('sc-input');
        if (sendSupportMessage(inp.value, supportChatSource)) { inp.value = ''; renderSupportChatList(); }
        inp.focus();
      });
      renderSupportChatList();
    }
    function closeSupportChat() { const el = document.getElementById('support-chat'); if (el) { el.remove(); scLockPage(false); } }
    // v13.2: keep the chat window inside the visible viewport, just above the on-screen keyboard (iOS Safari)
    function scSyncViewport() {
      const el = document.getElementById('support-chat');
      if (!el) return;
      const vv = window.visualViewport;
      const vw = vv ? vv.width : window.innerWidth, vh = vv ? vv.height : window.innerHeight;
      const left = vv ? vv.offsetLeft : 0, top = vv ? vv.offsetTop : 0;
      const kb = Math.max(0, window.innerHeight - (top + vh)); // space hidden below the visual viewport (keyboard)
      el.style.setProperty('--sc-l', left + 'px');
      el.style.setProperty('--sc-w', vw + 'px');
      el.style.setProperty('--sc-b', kb + 'px');
      el.style.setProperty('--sc-vh', vh + 'px');
    }
    let scSavedOverflow = null;
    function scLockPage(on) {
      const r = document.documentElement, b = document.body;
      if (on && scSavedOverflow === null) { scSavedOverflow = [r.style.overflow, b.style.overflow]; r.style.overflow = 'hidden'; b.style.overflow = 'hidden'; }
      else if (!on && scSavedOverflow !== null) { r.style.overflow = scSavedOverflow[0]; b.style.overflow = scSavedOverflow[1]; scSavedOverflow = null; }
    }
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', scSyncViewport); window.visualViewport.addEventListener('scroll', scSyncViewport); }
    window.addEventListener('resize', scSyncViewport);

    // =========================================================
    // 6. MAIN RENDER & EVENT BINDINGS
    // =========================================================
    function renderSafeSignedOut() {
      return `
        <div class="max-w-md mx-auto mt-6 rounded-2xl border border-brand-navy/30 dark:border-sky-900/60 bg-white dark:bg-slate-900 p-6 text-center">
          <h1 class="text-lg font-bold mb-2 text-brand-navy dark:text-sky-300">MiCC Safe</h1>
          <p class="text-sm text-slate-600 dark:text-slate-300 mb-4">${t('يرجى تسجيل الدخول للمتابعة.', 'Please sign in to continue.')}</p>
          <button onclick="toggleAuth()" class="w-full py-2.5 rounded-xl bg-brand-emerald hover:bg-brand-emeraldHover text-white text-sm font-semibold">${t('تسجيل الدخول التجريبي الآن', 'Demo Sign In Now')}</button>
        </div>
      `;
    }

    function render() {
      saveShared();
      renderHeader();
      renderFooter();
      const main = document.getElementById('main-content');
      const views = { safe: renderSafe, safeprivacy: renderSafePrivacy };
      main.classList.toggle('main-home', state.view === 'home' || state.view === 'store' || !views[state.view]);
      main.innerHTML = state.loggedIn ? (views[state.view] || renderSafe)() : renderSafeSignedOut();

      const fcForm = document.getElementById('free-consult-form');
      if (fcForm) fcForm.addEventListener('submit', e => {
        e.preventDefault();
        if (!state.loggedIn) { openLoginGateModal(state.view); return; }
        const val = id => (document.getElementById(id).value || '').trim();
        const errEl = document.getElementById('fc-error');
        const checks = [
          ['fc-name', val('fc-name').length >= 2, t('يرجى إدخال الاسم الكامل أو اسم الجهة.', 'Please enter your full name or organization.')],
          ['fc-phone', /^(\+?966|0)?5\d{8}$/.test(val('fc-phone').replace(/[\s-]/g, '')), t('يرجى إدخال رقم جوال صحيح (05xxxxxxxx).', 'Please enter a valid mobile number (05xxxxxxxx).')],
          ['fc-email', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val('fc-email')), t('يرجى إدخال بريد إلكتروني صحيح.', 'Please enter a valid email address.')],
          ['fc-notes', val('fc-notes').length >= 3, t('يرجى كتابة نبذة مختصرة.', 'Please add a brief note.')],
        ];
        checks.forEach(([id, ok]) => { const el = document.getElementById(id); el.classList.toggle('border-rose-500', !ok); el.setAttribute('aria-invalid', ok ? 'false' : 'true'); });
        const bad = checks.find(c => !c[1]);
        if (bad) { errEl.textContent = bad[2]; errEl.classList.remove('hidden'); document.getElementById(bad[0]).focus(); return; }
        errEl.classList.add('hidden');
        showToast(t('تم استلام طلبك، وسيتواصل معك فريق AMi قريبًا', 'Request received. The AMi team will contact you soon'));
        fcForm.reset();
      });

      const bkForm = document.getElementById('ekc-booking-form');
      if (bkForm) {
        bkForm.addEventListener('submit', e => {
          e.preventDefault();
          const payChecked = document.querySelector('input[name="bk-pay"]:checked');
          if (!payChecked) { showToast(t('يرجى اختيار طريقة الدفع', 'Please choose a payment method')); return; }
          const payMode = payChecked.value;
          if (payMode === 'micc' && !state.user.membershipActive) { showToast(t('متاحة لأعضاء الرفاقة', 'Members only')); return; }
          const offer = state.selectedEkcOffer || { track: EKC_TRACKS[0], opt: EKC_TRACKS[0].options[0] };
          if (payMode === 'micc') {
            const miccNeeded = Math.ceil(offer.opt.priceSar / (MICC_SAR_VALUE * 2));
            if (state.user.walletMicc < miccNeeded) { showToast(t('رصيد ميك غير كافٍ', 'Insufficient MiCC')); return; }
            state.user.walletMicc -= miccNeeded; state.user.walletProgressMicc += miccNeeded; state.user.usedOrTransferred = true;
            state.walletLogs.unshift({ ar: `حجز ${offer.track.titleAr}`, en: `Booked ${offer.track.titleEn}`, amount: `-${miccNeeded} MiCC` });
          }
          showToast(payMode === 'micc' ? t('تم تأكيد الموعد بنجاح', 'Appointment confirmed') : t(`تم تأكيد الموعد — جارٍ تحويلك إلى ${payProviderName(payMode)} لإتمام الدفع`, `Appointment confirmed — redirecting you to ${payProviderName(payMode)} to pay`));
          setView('ekc');
        });
      }


    }

    document.getElementById('brand-btn').addEventListener('click', () => setView(isSafeView() ? 'safe' : 'home'));
    document.querySelectorAll('.nav-link, .drawer-link').forEach(btn => btn.addEventListener('click', () => setView(btn.getAttribute('data-nav'))));
    document.getElementById('side-menu-btn').addEventListener('click', () => document.getElementById('side-drawer-backdrop').classList.remove('hidden'));
    document.getElementById('side-menu-close').addEventListener('click', closeDrawer);
    document.getElementById('side-drawer-backdrop').addEventListener('click', e => { if (e.target.id === 'side-drawer-backdrop') closeDrawer(); });
    document.getElementById('theme-btn').addEventListener('click', () => { state.dark = !state.dark; render(); });
    document.getElementById('lang-btn').addEventListener('click', () => { state.lang = state.lang === 'ar' ? 'en' : 'ar'; render(); });
    document.getElementById('auth-btn').addEventListener('click', toggleAuth);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') closeModal(); });
    document.getElementById('tier-overlay').addEventListener('click', e => { if (e.target.id === 'tier-overlay' || e.target.classList.contains('tg-wrap')) closeTierGuide(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTierGuide(); });

    function applyHashRoute() {
      if (location.hash === '#privacy') setView('safeprivacy');
    }
    window.addEventListener('hashchange', applyHashRoute);

    // v13: keep open tabs of both pages in sync
    window.addEventListener('storage', e => {
      if (e.key !== SHARED_KEY || !e.newValue) return;
      if (!loadShared(e.newValue)) return;
      if (PAGE === 'main' && !state.loggedIn && !PUBLIC_VIEWS.has(state.view)) state.view = 'home';
      const y = window.scrollY; render(); if (window.scrollY !== y) window.scrollTo(0, y);
    });
    try { const f = sessionStorage.getItem(FLASH_KEY); if (f) { sessionStorage.removeItem(FLASH_KEY); setTimeout(() => showToast(f), 60); } } catch (e) {}

    render();
    startLive();
    applyHashRoute();
  </script>
</body>
</html>
